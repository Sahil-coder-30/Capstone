  # ═══════════════════════════════════════════════════════════════════════════
  # SANDBOX SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  /sandbox/create-project:
    post:
      tags: [Sandbox Orchestration]
      summary: Create Project Record
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: |
        Allocates a new UUID sandboxId and registers the project in MongoDB with initial status `not_started`.
        Enforces a hard quota of **5 active projects** per user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, example: "My Vite React App" }
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, sandboxId, project]
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: "Project created successfully" }
                  sandboxId: { type: string, example: "123e4567-e89b-12d3-a456-426614174000" }
                  project: { $ref: '#/components/schemas/Project' }
        '400':
          description: |
            Validation error: Title is required and must be non-empty, OR user has hit the **5-project ceiling** (`You can only create up to 5 projects`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized - User identification missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '403':
          description: Project creation quota reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Database or pod provisioning error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: Kubernetes API server unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'

  /sandbox/projects:
    get:
      tags: [Sandbox Orchestration]
      summary: List All User Projects
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Returns all active projects belonging to the user with reconciled live Kubernetes pod status.
      responses:
        '200':
          description: User projects list
          content:
            application/json:
              schema:
                type: object
                required: [status, projects]
                properties:
                  status: { type: string, example: success }
