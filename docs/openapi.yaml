  /sandbox/start/{projectId}:
    post:
      tags: [Sandbox Orchestration]
      summary: Start Kubernetes Pod for Project
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Deploys a dedicated Kubernetes Pod and Service for the project, mounts local workspace, and spins up the sidecar sync agent to restore S3 assets.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pod created or already running
          content:
            application/json:
              schema:
                type: object
                required: [status, sandboxId, previewUrl, agentUrl]
                properties:
                  status: { type: string, example: success }
                  sandboxId: { type: string }
                  previewUrl: { type: string, example: "http://123e4567-e89b-12d3-a456-426614174000.preview.localhost" }
                  agentUrl: { type: string, example: "http://123e4567-e89b-12d3-a456-426614174000.agent.localhost" }
        '400':
          description: Invalid projectId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '409':
          description: Sandbox container already in running state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
        '500':
          description: Kubernetes Pod deployment or S3 sync pull error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '504':
          description: Pod startup readiness probe timed out (>60s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutErrorResponse'

  /sandbox/stop/{projectId}:
    post:
      tags: [Sandbox Orchestration]
      summary: Gracefully Stop Sandbox Pod
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Triggers final S3 sync, terminates the Kubernetes Pod and Service, and removes the Redis TTL heartbeat key.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sandbox stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Invalid projectId format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Final S3 sync push failure or Kubernetes Pod termination error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  # ═══════════════════════════════════════════════════════════════════════════
  # SANDBOX CONTAINER AGENT DAEMON (In-Container API)
  # ═══════════════════════════════════════════════════════════════════════════
  /agent/list-files:
    get:
      tags: [Sandbox Agent]
      summary: Recursively List Workspace Directory
      description: Traverses `/workspace` and returns all relative file paths, automatically ignoring `node_modules` and `.git`.
      responses:
        '200':
          description: File tree resolved
          content:
            application/json:
              schema:
                type: object
                required: [status, files]
                properties:
                  status: { type: string, example: ok }
                  files:
                    type: array
                    items: { type: string }
                    example: ["src/App.jsx", "src/main.jsx", "package.json", "index.html"]
        '400':
          description: Path traversal security violation detected (`..`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Workspace directory does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Filesystem traversal I/O error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/read-file:
    get:
      tags: [Sandbox Agent]
      summary: Read Multiple Workspace Files
      description: Reads text contents of one or more files in batch.
      parameters:
        - name: files
          in: query
          required: true
          description: Comma-separated list of relative file paths
          schema:
            type: string
            example: "src/App.jsx,package.json"
      responses:
        '200':
          description: File contents retrieved
          content:
            application/json:
              schema:
                type: object
                required: [status, files]
                properties:
                  status: { type: string, example: ok }
                  files:
                    type: array
                    items:
                      type: object
                      required: [file, content]
                      properties:
                        file: { type: string }
                        content: { type: string }
                        error: { type: string, nullable: true }
        '400':
          description: Missing files query parameter or path traversal attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: One or more requested files not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '413':
          description: File size exceeds maximum readable buffer limit (>10MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Filesystem read failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/update-file:
    patch:
      tags: [Sandbox Agent]
      summary: Batch Overwrite Workspace Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  items:
                    type: object
                    required: [file, content]
                    properties:
                      file: { type: string, example: "src/App.jsx" }
                      content: { type: string, example: "import React from 'react';..." }
      responses:
        '200':
          description: Files updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, results]
                properties:
                  status: { type: string, example: ok }
                  results:
                    type: array
                    items:
                      type: object
                      required: [file, status]
                      properties:
                        file: { type: string }
                        status: { type: string, example: "updated" }
                        error: { type: string, nullable: true }
        '400':
          description: Missing updates array or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Target file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '409':
          description: |
            Patch conflict / Hunk mismatch: Target file modified concurrently in IDE Monaco editor.
            Frontend should trigger a 3-way merge resolution dialog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
        '422':
          description: Malformed unified diff syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Filesystem write error or disk quota exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/create-file:
    post:
      tags: [Sandbox Agent]
      summary: Batch Create Workspace Files & Directories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: object
                    required: [file, content]
                    properties:
                      file: { type: string, example: "src/components/Header.jsx" }
                      content: { type: string, example: "export default function Header() {}" }
      responses:
        '201':
          description: Files created successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, results]
                properties:
                  status: { type: string, example: ok }
                  results:
                    type: array
                    items:
                      type: object
                      required: [file, status]
                      properties:
                        file: { type: string }
                        status: { type: string, example: "created" }
                        error: { type: string, nullable: true }
        '400':
          description: Missing files array or invalid relative file path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: Target file already exists and overwrite flag was false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorResponse'
        '500':
          description: Filesystem creation error or disk full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/delete-file:
    delete:
      tags: [Sandbox Agent]
      summary: Delete Files or Directories
      parameters:
        - name: file
          in: query
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Files/directories purged
          content:
            application/json:
              schema:
                type: object
                required: [status, results]
                properties:
                  status: { type: string, example: ok }
                  results:
                    type: array
                    items:
                      type: object
                      required: [file, status]
                      properties:
                        file: { type: string }
                        status: { type: string, example: "deleted" }
        '400':
          description: Missing file/files parameter or path traversal attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '403':
          description: Forbidden - Attempted to delete protected root or configuration directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '404':
          description: File or directory does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Filesystem unlink failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/search-code:
    get:
      tags: [Sandbox Agent]
      summary: High-Speed Regex Code Search
      description: Fast in-memory / ripgrep text and regex search across workspace files with surrounding context lines.
      parameters:
        - name: pattern
          in: query
          required: true
          schema: { type: string, example: "useState" }
        - name: isRegex
          in: query
          schema: { type: boolean, default: false }
        - name: caseSensitive
          in: query
          schema: { type: boolean, default: false }
        - name: contextLines
          in: query
          schema: { type: integer, default: 2, minimum: 0, maximum: 5 }
        - name: maxResults
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Match occurrences with line numbers and file paths
          content:
            application/json:
              schema:
                type: object
                required: [status, matches]
                properties:
                  status: { type: string, example: ok }
                  matches:
                    type: array
                    items:
                      type: object
                      required: [file, line, content]
                      properties:
                        file: { type: string }
                        line: { type: integer }
                        content: { type: string }
                        contextBefore: { type: array, items: { type: string } }
                        contextAfter: { type: array, items: { type: string } }
        '400':
          description: Invalid regex syntax or missing pattern parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Ripgrep process execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/exec:
    post:
      tags: [Sandbox Agent]
      summary: Execute Bash Command in Sandbox
      description: Spawns a shell process inside `/workspace`. Has a 30s timeout (120s for npm install/build) and 1MB stdout/stderr buffer protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, example: "npm install lucide-react" }
                subDir: { type: string, example: "src" }
      responses:
        '200':
          description: Command execution completed (check `timedOut` and `error` fields for process status)
          content:
            application/json:
              schema:
                type: object
                required: [status, success, stdout, stderr, timedOut]
                properties:
                  status: { type: string, example: ok }
                  success: { type: boolean, example: true }
                  stdout: { type: string, example: "added 1 package in 1.4s" }
                  stderr: { type: string }
                  error: { type: string, nullable: true }
                  timedOut: { type: boolean, example: false }
        '400':
          description: Missing command parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '408':
          description: Execution timeout reached (>30s for generic bash, >120s for npm build)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutErrorResponse'
        '500':
          description: Process spawning or container shell crash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /agent/vite-runtime-errors:
    get:
      tags: [Sandbox Agent]
      summary: Fetch Vite Dev Server Runtime Logs
      description: Returns captured runtime compiler and browser crash errors for consumption by the Debugger Agent.
      responses:
        '200':
          description: Runtime error logs
          content:
            application/json:
              schema:
                type: object
                required: [status, errors]
                properties:
                  status: { type: string, example: ok }
                  errors:
                    type: array
                    items: { type: string }
        '500':
          description: Internal log buffer read error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

# ═══════════════════════════════════════════════════════════════════════════
# REUSABLE DATA COMPONENTS & SCHEMAS
# ═══════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued by Auth Service. Verified via JWKS public key (`auth-rsa-v1`).
    CookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Access token stored in HTTP cookie.
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "RS256 JWT containing verified `role: admin` claim."

  schemas:
    StandardSuccessResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: success }
        message: { type: string, example: Action completed successfully }

    StandardHealthResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: ok }
        message: { type: string, example: Server is healthy }

    StandardErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        message: { type: string, example: "An unexpected error occurred" }
        code: { type: string, example: "INTERNAL_ERROR" }
        timestamp: { type: string, format: date-time }

    ValidationErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code: { type: string, example: "VALIDATION_ERROR" }
        message: { type: string, example: "Invalid request payload or parameters" }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, example: "experienceYears" }
              message: { type: string, example: "Must be a non-negative number" }

    UnauthorizedErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID, NO_TOKEN_PROVIDED]
          example: TOKEN_EXPIRED
        message: { type: string, example: "Unauthorized: Token missing, invalid, or expired" }

    TokenSecurityErrorResponse:
      type: object
      required: [status, message, code]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [TOKEN_REUSE_DETECTED, SESSION_REVOKED]
          example: TOKEN_REUSE_DETECTED
        message: { type: string, example: "Token reuse detected — all sessions revoked" }

    ForbiddenErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [FORBIDDEN, ADMIN_REQUIRED, CROSS_TENANT_ACCESS_DENIED, PROJECT_LIMIT_REACHED]
          example: FORBIDDEN
        message: { type: string, example: "You are not authorized to perform this action" }

    NotFoundErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code: { type: string, example: "NOT_FOUND" }
        message: { type: string, example: "The requested resource could not be found" }

    InsufficientCreditsErrorResponse:
      type: object
      required: [status, code, message]
      properties:
        status: { type: string, example: error }
        code: { type: string, example: "INSUFFICIENT_CREDITS" }
        message: { type: string, example: "Insufficient mistral credits. Free users receive 20 credits per model company." }
        company:
          type: string
          enum: [mistral, google, openai, anthropic, groq]
          example: "mistral"
        creditsRemaining: { type: number, example: 0.0 }
        upgradeUrl: { type: string, example: "/pricing" }

    ConflictErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [CONFLICT, PATCH_CONFLICT, RUN_ALREADY_ACTIVE, IDEMPOTENCY_CONFLICT, SANDBOX_ALREADY_RUNNING]
          example: PATCH_CONFLICT
        message: { type: string, example: "Resource conflict: target state modified concurrently" }
        details:
          type: object
          properties:
            hunkMismatch: { type: boolean, example: true }
            activeRunId: { type: string }

    RateLimitErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code: { type: string, example: "RATE_LIMIT_EXCEEDED" }
        message: { type: string, example: "Too many requests. Please wait before retrying." }
        retryAfter: { type: integer, example: 60, description: "Seconds until rate limit window resets" }

    ServiceUnavailableErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [SERVICE_UNAVAILABLE, AI_PROVIDER_DOWN, AI_PROVIDER_NOT_CONFIGURED, K8S_UNREACHABLE]
          example: AI_PROVIDER_DOWN
        message: { type: string, example: "Upstream dependency is temporarily unavailable" }
        retryable: { type: boolean, example: true }

    GatewayTimeoutErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string, example: error }
        code:
          type: string
          enum: [GATEWAY_TIMEOUT, POD_STARTUP_TIMEOUT, EXEC_TIMEOUT]
          example: POD_STARTUP_TIMEOUT
        message: { type: string, example: "Target pod or command timed out" }
        retryable: { type: boolean, example: true }

    SSEStreamErrorFrame:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Insufficient mistral credits." }
        code:
          type: string
          enum: [INSUFFICIENT_CREDITS, AI_PROVIDER_NOT_CONFIGURED, CREDIT_CHECK_FAILED, AGENT_EXECUTION_ERROR]
          example: INSUFFICIENT_CREDITS
        company:
          type: string
          enum: [mistral, google, openai, anthropic, groq]
          example: "mistral"

    JWKSResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, use, alg, kid, n, e]
            properties:
              kty: { type: string, example: RSA }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              kid: { type: string, example: auth-rsa-v1 }
              n: { type: string, description: "RSA Public Modulus" }
              e: { type: string, example: AQAB }

    User:
      type: object
      required: [_id, email, name]
      properties:
        _id: { type: string, example: "67cb1a2934128912..." }
        googleId: { type: string, example: "1098237192837..." }
        name: { type: string, example: "Sahil Kumar" }
        email: { type: string, format: email, example: "sahil@example.com" }
        photo: { type: string, format: uri, example: "https://lh3.googleusercontent.com/..." }
        createdAt: { type: string, format: date-time }

    Profile:
      type: object
      properties:
        userId: { type: string }
        bio: { type: string }
        github: { type: string }
        linkedin: { type: string }
        twitter: { type: string }
        website: { type: string }
        company: { type: string }
        jobTitle: { type: string }
        skills: { type: array, items: { type: string } }
        experienceYears: { type: integer }

    Preferences:
      type: object
      properties:
        theme: { type: string, enum: [dark, light, system], default: dark }
        editor:
          type: object
          properties:
            fontSize: { type: string, default: "14px" }
            tabSize: { type: string, default: "2" }
            autoSave: { type: boolean, default: true }
            minimap: { type: boolean, default: true }
            wordWrap: { type: boolean, default: true }
        copilot:
          type: object
          properties:
            modelPreference: { type: string, default: "gemini-2.5-flash" }
            autoSuggest: { type: boolean, default: true }
            interactiveMode: { type: string, enum: [concise, detailed], default: detailed }

    Credit:
      type: object
      properties:
        userId: { type: string }
        subscription: { type: string, enum: [free, pro, enterprise] }
        totalTokens: { type: integer, example: 54200 }
        promptTokens: { type: integer, example: 21000 }
        completionTokens: { type: integer, example: 33200 }
        providers:
          type: object
          additionalProperties:
            type: object
            properties:
              creditsRemaining: { type: number, example: 18.2 }
              billableTokens: { type: integer }
              billableCents: { type: integer }

    Package:
      type: object
      properties:
        id: { type: string, example: "pkg_pro_monthly" }
        name: { type: string, example: "Pro Developer Monthly" }
        priceINR: { type: integer, example: 999 }
        priceINRPaise: { type: integer, example: 99900 }
        tier: { type: string, example: "pro" }
        durationDays: { type: integer, example: 30 }
        features: { type: array, items: { type: string } }

    Transaction:
      type: object
      properties:
        _id: { type: string }
        accountId: { type: string }
        orderId: { type: string }
        paymentId: { type: string }
        amountPaise: { type: integer, example: 99900 }
        currency: { type: string, example: INR }
        status: { type: string, enum: [success, failed, pending] }
        packageId: { type: string }
        createdAt: { type: string, format: date-time }

    UsageEvent:
      type: object
      properties:
        company: { type: string, example: mistral }
        modelId: { type: string, example: "mistral-large-latest" }
        promptTokens: { type: integer, example: 300 }
        completionTokens: { type: integer, example: 600 }
        totalTokens: { type: integer, example: 900 }
        timestamp: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        _id: { type: string }
        projectId: { type: string }
        agentType: { type: string, enum: [codingAgent, copilot] }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        deletionStatus: { type: string, enum: [active, trash] }
        timestamp: { type: string, format: date-time }

    Project:
      type: object
      properties:
        _id: { type: string }
        user: { type: string }
        title: { type: string, example: "Vite React App" }
        sandboxId: { type: string, example: "123e4567-e89b-12d3-a456-426614174000" }
        status: { type: string, enum: [not_started, building, live, stopped] }
        deletionStatus: { type: string, enum: [active, trash] }
        createdAt: { type: string, format: date-time }
