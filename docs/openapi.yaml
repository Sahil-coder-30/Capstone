  # ---------------------------------------------------------------------------
  # GET /api/payments/dashboard/overview
  # ---------------------------------------------------------------------------
  # PURPOSE    Everything the payments_frontend home page shows, in one call.
  # CALLED BY  payments_frontend dashboard on load.
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/dashboard/overview + Bearer--> payments-service
  #     buildCreditView (as GET /credit), then in parallel:
  #       subscription state, 30-day usage analytics, 5 recent transactions, 5 recent events
  #   <-- 200 { data: { subscription, credit, analytics, recentTransactions[], recentEvents[] } }
  # CODE       Payments/controllers/subscription.controller.js (getDashboardOverview)
  /api/payments/dashboard/overview:
    get:
      tags: [Payments dashboard]
      operationId: getDashboardOverview
      summary: Payments dashboard in one call
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      subscription: { $ref: '#/components/schemas/Subscription' }
                      credit: { $ref: '#/components/schemas/CreditView' }
                      analytics: { $ref: '#/components/schemas/UsageAnalytics' }
                      recentTransactions:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
                      recentEvents:
                        type: array
                        items: { $ref: '#/components/schemas/UsageEvent' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ===========================================================================
  #  AI ORCHESTRATION SERVICE   (Ai_orchestration/, port 3000, ingress /api/ai)
  #  Mongo "ai" (chats, sessions, memories), Redis (rate limit), NVIDIA models.
  #  Middleware order on the costly routes:
  #    identifyUser        Bearer or cookie, Redis blacklist, JWKS by kid, RS256
  #    requireOwnedSandbox asks Sandbox GET /api/sandbox/projects with the caller's token
  #                        (60 s cache) and REPLACES body.sandboxId / projectId with the
  #                        verified pair. Fails closed: 503 Sandbox down, 403 not yours.
  #    aiRateLimiter       Redis Lua token bucket per user (free 20/min). Fails open.
  #                        Tier is always "free" today: the token has no subscription claim.
  #    creditLedger        Payments GET /credit/check. canQuery false -> 402. Payments down -> open.
  #  Errors before a stream opens: FaultKit JSON. After the stream opens: SSE error events.
  #  AI runs live in this process (one replica). A restart loses live runs.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # POST /api/ai/code-agent/invoke
  # ---------------------------------------------------------------------------
  # PURPOSE    Starts an Orion run: the multi-step coding agent plans, writes code in the
  #            user's sandbox, tests and reviews it. Streams progress as Server-Sent Events.
  # CALLED BY  Frontend coding-agent panel (features/coding-agent, useCodingAgent), on send.
  # AUTH       Bearer. Then sandbox ownership, rate limit and credits (see the banner above).
  # HLD
  #
  #   Browser          ai-service                         Auth        Sandbox pod (sidecar)   Mongo ai   Payments
  #     | POST invoke     |                                  |                 |                  |          |
  #     |---------------->| identifyUser, requireOwnedSandbox (Sandbox /projects), rate limit, credit check
  #     |<-- 200 text/event-stream, "retry: 3000"            |                 |                  |          |
  #     |                 | run already live for user+project? -> agent:error AGENT_RUN_IN_PROGRESS
  #     |                 | open or create the chat session ------------------------------------->|          |
  #     |                 |-- POST /api/auth/sandbox-token ->|                 |                  |          |
  #     |                 |<- 2 h sandbox token -------------|                 |                  |          |
  #     |                 | load last 10 messages + memory notes -------------------------------->|          |
  #     |                 | save the user message ----------------------------------------------->|          |
  #     |<-- agent:run, agent:session, agent:msg_created, agent:model, agent:status                   |          |
  #     |                 | LangGraph: router -> planner -> critic -> plan_review (pause)       |          |
  #     |<-- agent:plan_review  (unless autoApprovePlan)     |                 |                  |          |
  #     |   ... user calls POST /code-agent/plan-approve ... |                 |                  |          |
  #     |                 | coder -> tester -> reviewer -> debugger -> finalizer                |          |
  #     |                 |-- MCP tools/call (read_file, patch_file, execute_command ...) ------>|          |
  #     |<-- agent:tool_start / agent:tool_end / agent:thinking / agent:message / agent:steps      |          |
  #     |<-- agent:final, agent:done (or agent:stopped / agent:error)                             |          |
  #     |                 | save the assistant message ------------------------------------------>|          |
  #     |                 | POST /api/payments/credit/update (requestId orion:<runId>) ------------------->|
  #     |                 | schedule memory update (summary, title, project notes) ---------------------->|
  #
  #   The run is independent of the HTTP connection: closing the tab does NOT stop it.
  #   Re-attach with GET /api/ai/code-agent/stream/{projectId}.
  # STEPS      1. Middleware chain. 2. Open SSE (200 at once). 3. Validate message, projectId,
  #            sandboxId. 4. startRun: one live run per user + project; open the chat; get a
  #            sandbox token; save the prompt. 5. Run the graph in the background and publish
  #            every event to all subscribers (buffer of the last 4000 events for replay).
  # LIMITS     60 minutes of active work per segment (AGENT_TIMEOUT); plan review waits
  #            30 minutes, then the run stops; up to 5 attachments, 12,000 chars each.
  # FAILURES   Before the stream: 401, 402, 403, 429, 503 (FaultKit JSON).
  #            In the stream (event agent:error, data.code): VALIDATION_ERROR,
  #            AGENT_RUN_IN_PROGRESS, AI_PROVIDER_NOT_CONFIGURED, AGENT_START_FAILED,
  #            MODEL_CALL_TIMEOUT, RATE_LIMIT, PROVIDER_CREDITS, AGENT_TIMEOUT, AGENT_ERROR.
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (codeAgentInvoke),
  #            Ai_orchestration/src/services/agentRun.service.js, src/agent/graph/orion.graph.js
  /api/ai/code-agent/invoke:
    post:
      tags: [AI Orion]
      operationId: orionInvoke
      summary: Start an Orion coding run (SSE stream)
      description: |
        Starts Orion on the caller's sandbox and streams events. Every frame is
        `id: <seq>`, `event: <name>`, `data: <json>`. Keep the last `id` to resume with
        `GET /api/ai/code-agent/stream/{projectId}` and the `Last-Event-ID` header.
        A `: ping` comment arrives every 15 seconds.

        Event names: `agent:run`, `agent:session`, `agent:msg_created`, `agent:model`,
        `agent:status`, `agent:thinking`, `agent:steps`, `agent:step`, `agent:message`,
        `agent:message_retract`, `agent:tool_start`, `agent:tool_end`, `agent:tool_log`,
        `agent:plan_review`, `agent:final`, `agent:done`, `agent:stopped`, `agent:error`,
        `agent:snapshot` (only on re-attach).

        Only one run per user and project at a time. Without `sessionId` a new chat is created
        and announced in `agent:session`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrionInvokeInput' }
      responses:
        '200':
          description: SSE stream. Problems after this point arrive as `agent:error` events.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of `OrionEvent` frames (see the `x-sse-event` schema).
                x-sse-event: { $ref: '#/components/schemas/OrionEvent' }
              examples:
                start:
                  value: |
                    retry: 3000

                    id: 1
                    event: agent:run
                    data: {"runId":"m3x9a1b2c3","threadId":"019f...:1731600000000","projectId":"6735...","sessionId":"6736..."}

                    id: 2
                    event: agent:session
                    data: {"sessionId":"6736...","title":"Add a dark mode toggle","isNew":true}
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # GET /api/ai/code-agent/stream/{projectId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Re-attaches to a live Orion run after a page reload or a network drop.
  # CALLED BY  Frontend useCodingAgent on mount and on SSE reconnect (?sessionId= of the open chat).
  # AUTH       Bearer. Only the caller's own run is found (key = userId + projectId).
  # HLD
  #   Browser --GET /api/ai/code-agent/stream/<projectId>?sessionId=..  Last-Event-ID: 57--> ai-service
  #     getRun(user, project)
  #       none, other chat, or finished without Last-Event-ID --> 204 (no run to follow)
  #       Last-Event-ID still in the 4000-event buffer --> replay events 58.. then live events
  #       older than the buffer, or no Last-Event-ID     --> one agent:snapshot, then live events
  #       finished run --> replay / snapshot, then the stream ends
  # NOTE       Finished runs are kept 2 minutes for late reconnects.
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (codeAgentStream),
  #            agentRun.service.js (attachSubscriber, snapshotOf)
  /api/ai/code-agent/stream/{projectId}:
    get:
      tags: [AI Orion]
      operationId: orionStream
      summary: Re-attach to a live Orion run (SSE)
      description: |
        `204` means there is nothing to follow. Otherwise the stream replays missed events
        after `Last-Event-ID`, or sends one `agent:snapshot` with the whole run state, and then
        continues live.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: sessionId
          in: query
          description: Follow the run only if it works in this chat.
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: lastEventId
          in: query
          description: Same as the `Last-Event-ID` header, for clients that cannot set headers.
          schema: { type: integer }
        - name: Last-Event-ID
          in: header
          schema: { type: integer }
      responses:
        '200':
          description: SSE stream (replay or `agent:snapshot`, then live events).
          content:
            text/event-stream:
              schema: { type: string }
        '204':
          description: No live run for this project (or it works in another chat).
        '401': { $ref: '#/components/responses/FaultUnauthorized' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/code-agent/stop
  # ---------------------------------------------------------------------------
  # PURPOSE    Stops the caller's Orion run on a project.
  # CALLED BY  Frontend stop button in the coding-agent composer.
  # AUTH       Bearer. Only the caller's own run.
  # HLD
  #   Browser --POST /api/ai/code-agent/stop { projectId }--> ai-service
  #     getRun(user, project)                      none --> 404 NO_ACTIVE_RUN
  #     running   --> abort the graph; the stream then sends agent:stopped
  #     paused for review or starting --> finish at once as stopped
  #     already finished --> 200 "already finished"
  #   On stop: partial answer saved with "_Stopped by user._", sandbox token released,
  #   usage still recorded in Payments.
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (codeAgentStop), agentRun.service.js (stopRun)
  /api/ai/code-agent/stop:
    post:
      tags: [AI Orion]
      operationId: orionStop
      summary: Stop my Orion run on a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRef' }
      responses:
        '200':
          description: Stopping, or the run had already finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  message: { type: string, enum: [Stopping the agent run, The run already finished] }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/code-agent/plan-approve
  # ---------------------------------------------------------------------------
  # PURPOSE    Approves the plan Orion paused on, so it starts writing code.
  # CALLED BY  Frontend PlanReviewCard "Approve".
  # AUTH       Bearer. The fresh token renews the run's sandbox token (2 h) and the
  #            billing token.
  # HLD
  #   Browser --POST plan-approve { projectId }--> ai-service
  #     getRun              none --> 404 NO_ACTIVE_RUN
  #     status != awaiting_review --> 409 NO_PLAN_PENDING
  #     POST /api/auth/sandbox-token (renew) --> resume graph with Command({ resume: { approved: true } })
  #   <-- 202, progress continues on the SSE stream (coder, tester, reviewer ...)
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (codeAgentPlanApprove), agentRun.service.js (approvePlan)
  /api/ai/code-agent/plan-approve:
    post:
      tags: [AI Orion]
      operationId: orionPlanApprove
      summary: Approve the pending plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRef' }
      responses:
        '202':
          description: Approved. Watch the SSE stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }
        '409': { $ref: '#/components/responses/AiNoPlanPending' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/code-agent/plan-reject
  # ---------------------------------------------------------------------------
  # PURPOSE    Rejects the pending plan with feedback; Orion plans again.
  # CALLED BY  Frontend PlanReviewCard "Request changes".
  # AUTH       Bearer (renews tokens like approve).
  # HLD
  #   Browser --POST plan-reject { projectId, feedback }--> ai-service
  #     same checks as approve --> resume with { approved: false, feedback } --> planner runs again
  #   <-- 202, a new agent:plan_review arrives on the stream
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (codeAgentPlanReject), agentRun.service.js (rejectPlan)
  /api/ai/code-agent/plan-reject:
    post:
      tags: [AI Orion]
      operationId: orionPlanReject
      summary: Reject the pending plan with feedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectRef'
                - type: object
                  properties:
                    feedback: { type: string, description: What to change in the plan. }
      responses:
        '202':
          description: Re-planning. Watch the SSE stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }
        '409': { $ref: '#/components/responses/AiNoPlanPending' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/app-agent/invoke
  # ---------------------------------------------------------------------------
  # PURPOSE    Clio, the editor copilot: one answer about the open file, streamed token by token.
  #            Can read the project and make small edits (patch_file, update_file).
  # CALLED BY  Frontend copilot panel and the floating app-agent (features/copilot).
  # AUTH       Bearer, then ownership, rate limit, credits.
  # HLD
  #   Browser --POST /api/ai/app-agent/invoke { message, projectId, sandboxId, sessionId?,
  #             activeFile?, activeFileContent? }--> ai-service (middleware chain)
  #   <-- 200 text/event-stream
  #     open or create the Clio chat --> event: session {"id","title","isNew",...}
  #     Clio graph (one node, no checkpointer) with history + memory --> MCP tools on the sidecar
  #     data: <text chunk> ... (one data: line per text line)
  #     event: final <whole answer>, event: done [DONE]
  #     save both messages, record usage (agentType copilot), schedule the memory update
  #   Errors in the stream: event: error {"message","code"}. Heartbeat ": heartbeat" every 15 s.
  # NOTE       Unlike Orion, closing the connection ends nothing on the client side, but there
  #            is no re-attach route: the answer is still saved in the chat.
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (appAgentInvoke),
  #            src/services/copilot.service.js (runCopilot), src/agent/graph/clio.graph.js
  /api/ai/app-agent/invoke:
    post:
      tags: [AI Clio]
      operationId: clioInvoke
      summary: Ask Clio (copilot), streamed
      description: |
        SSE with plain text frames. Order: `event: session` (JSON), many `data:` text chunks,
        `event: final` (the whole answer as text), `event: done` with `[DONE]`.
        A multi-line chunk is sent as several `data:` lines; join them with newlines.
        On failure: `event: error` with JSON `{ message, code }`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClioInvokeInput' }
      responses:
        '200':
          description: SSE stream.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: session
                data: {"id":"6736...","projectId":"6735...","title":"Explain useEffect","isNew":true}

                data: useEffect runs after

                data:  every render

                event: final
                data: useEffect runs after every render ...

                event: done
                data: [DONE]
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/app-agent/title
  # ---------------------------------------------------------------------------
  # PURPOSE    Turns a project idea into a short project title.
  # CALLED BY  Frontend new-project dialog (dashboard), before create-project.
  # AUTH       Bearer, rate limit, credits (no sandbox needed).
  # HLD
  #   Browser --POST /api/ai/app-agent/title { message }--> ai-service (identifyUser, rate limit, credits)
  #     fast model, JSON answer { title } --> Payments credit/update (agentType title)
  #   <-- 200 { title }   (any model problem gives "Untitled Project", never an error)
  # CODE       Ai_orchestration/src/controllers/ai.controller.js (appAgentTitle), copilot.service.js (generateTitle)
  /api/ai/app-agent/title:
    post:
      tags: [AI Clio]
      operationId: generateProjectTitle
      summary: Generate a project title from a prompt
      description: Returns at most 80 characters. Falls back to `Untitled Project` when the model fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: The project idea. }
                userPrompt: { type: string, description: Alias of message. }
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                type: object
                required: [title]
                properties:
                  title: { type: string, maxLength: 80, examples: [Weather Dashboard] }
        '400':
          description: No message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: message or userPrompt is required }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }

  # ---------------------------------------------------------------------------
  # GET /api/ai/chats/{agentType}/sessions
  # ---------------------------------------------------------------------------
  # PURPOSE    Lists the caller's chats of one agent in one project, newest first, 50 a page.
  # CALLED BY  Frontend chat-history sidebar (useChatSessions), for Orion and Clio.
  # AUTH       Bearer. Every query starts with the token's userId.
  # HLD
  #   Browser --GET /api/ai/chats/codingAgent/sessions?projectId=..&before=..--> ai-service
  #     first call per project: move pre-session messages into "Earlier chat" sessions
  #       (rows without userId are claimed only after Sandbox confirms the caller owns the project)
  #     Session.find({ userId, projectId, deletionStatus: active, lastMessageAt < before })
  #       --> Mongo orionchatsessions | cliochatsessions
  #     codingAgent: liveSessionId = the chat a live Orion run works in (so the UI can open it)
  #   <-- 200 { sessions[], hasMore, liveSessionId }
  # PAGING     Pass the lastMessageAt of the last item as ?before= to get the next page.
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (listSessions),
  #            src/services/chatSession.service.js, src/models/chatStores.js
  /api/ai/chats/{agentType}/sessions:
    get:
      tags: [AI chats]
      operationId: listChatSessions
      summary: List my chats in a project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - name: projectId
          in: query
          required: true
          schema: { type: string }
        - name: before
          in: query
          description: Cursor. Only chats with lastMessageAt before this date.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page of chats.
          content:
            application/json:
              schema:
                type: object
                required: [status, sessions, hasMore]
                properties:
                  status: { type: string, const: ok }
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/ChatSession' }
                  hasMore: { type: boolean }
                  liveSessionId:
                    type: [string, 'null']
                    description: codingAgent only. The chat a live Orion run is working in.
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }

  # ---------------------------------------------------------------------------
  # GET /api/ai/chats/{agentType}/sessions/{sessionId}/messages
  # ---------------------------------------------------------------------------
  # PURPOSE    Messages of one chat (last 500, oldest first), with tool logs and steps.
  # CALLED BY  Frontend when a chat is opened in the sidebar.
  # AUTH       Bearer. A session is never looked up by id alone.
  # HLD        Browser --GET .../sessions/<id>/messages--> ai-service
  #              findSession({ userId, _id, active }) (not found or not an ObjectId: 404)
  #              Message.find({ userId, projectId, sessionId, active }).sort(-timestamp).limit(500)
  #            <-- 200 { session, messages[] }
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (getSessionMessages)
  /api/ai/chats/{agentType}/sessions/{sessionId}/messages:
    get:
      tags: [AI chats]
      operationId: getChatMessages
      summary: Messages of one of my chats
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: The chat and its messages.
          content:
            application/json:
              schema:
                type: object
                required: [status, session, messages]
                properties:
                  status: { type: string, const: ok }
                  session: { $ref: '#/components/schemas/ChatSession' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }

  # ---------------------------------------------------------------------------
  # PATCH | DELETE /api/ai/chats/{agentType}/sessions/{sessionId}
  # ---------------------------------------------------------------------------
  # PURPOSE    PATCH renames a chat. DELETE moves it to trash.
  # CALLED BY  Frontend sidebar chat menu (rename, delete).
  # AUTH       Bearer.
  # HLD (PATCH)  { title } trimmed, 1..80 chars --> session.title, titleLocked = true
  #              (the memory agent never renames it again) --> 200 { session }
  # HLD (DELETE) codingAgent chat with a live Orion run --> 409 "Stop it first"
  #              else deletionStatus = trash, deletedAt = now --> 200
  # CODE         Ai_orchestration/src/controllers/chat.controller.js (renameSession, trashSession)
  /api/ai/chats/{agentType}/sessions/{sessionId}:
    patch:
      tags: [AI chats]
      operationId: renameChatSession
      summary: Rename one of my chats
      description: A renamed chat keeps its title; the memory agent stops naming it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  session: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }
    delete:
      tags: [AI chats]
      operationId: trashChatSession
      summary: Move one of my chats to trash
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: In trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }
        '409': { $ref: '#/components/responses/FaultConflict' }

  # ---------------------------------------------------------------------------
  # PATCH /api/ai/chats/{agentType}/sessions/{sessionId}/restore
  # ---------------------------------------------------------------------------
  # PURPOSE    Brings a chat back from trash.
  # CALLED BY  Frontend trash page.
  # HLD        findSession({ userId, _id, status: trash }) --> deletionStatus active --> 200 { session }
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (restoreSession)
  /api/ai/chats/{agentType}/sessions/{sessionId}/restore:
    patch:
      tags: [AI chats]
      operationId: restoreChatSession
      summary: Restore one of my chats from trash
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  session: { $ref: '#/components/schemas/ChatSession' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }

  # ---------------------------------------------------------------------------
  # DELETE /api/ai/chats/{agentType}/sessions/{sessionId}/permanent
  # ---------------------------------------------------------------------------
  # PURPOSE    Deletes a trashed chat and all its messages for good.
  # CALLED BY  Frontend trash page "Delete forever".
  # HLD        findSession(status: trash; an active chat is a 404, trash it first)
  #              --> Message.deleteMany({ userId, sessionId }) --> Session.deleteOne --> 200
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (deleteSessionForever)
  /api/ai/chats/{agentType}/sessions/{sessionId}/permanent:
    delete:
      tags: [AI chats]
      operationId: deleteChatSessionForever
      summary: Permanently delete one of my trashed chats
      description: Only works on a chat that is already in trash.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentTypePath'
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }

  # ---------------------------------------------------------------------------
  # GET /api/ai/chats/trash
  # ---------------------------------------------------------------------------
  # PURPOSE    Everything the caller has in trash, from both agents (up to 200 each kind each agent).
  # CALLED BY  Frontend trash page.
  # HLD        for codingAgent and copilot stores: trashed sessions + trashed messages of userId
  #            <-- 200 { trashSessions[], trashMessages[] } (each item carries agentType, deletedAt)
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (getTrash)
  /api/ai/chats/trash:
    get:
      tags: [AI chats]
      operationId: listChatTrash
      summary: My trashed chats and messages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  trashSessions:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ChatSession'
                        - type: object
                          properties:
                            agentType: { $ref: '#/components/schemas/ChatAgentType' }
                            deletedAt: { type: string, format: date-time }
                  trashMessages:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/ChatMessage'
                        - type: object
                          properties:
                            _id: { type: string }
                            projectId: { type: string }
                            sessionId: { type: [string, 'null'] }
                            agentType: { $ref: '#/components/schemas/ChatAgentType' }
                            deletedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }

  # ---------------------------------------------------------------------------
  # POST /api/ai/chats/message/batch-delete   and   DELETE /api/ai/chats/message/{messageId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Moves one or many messages to trash.
  # CALLED BY  Frontend MessageActions (delete one), multi-select delete (batch).
  # HLD        ids (array or comma list), invalid ids dropped --> updateMany({ _id in ids, userId,
  #            active }) --> trash --> 200 "<n> message(s) moved to trash" (n may be 0)
  # NOTE       agentType comes from the body (batch) or ?agentType= (single); default codingAgent.
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (trashMessages)
  /api/ai/chats/message/batch-delete:
    post:
      tags: [AI chats]
      operationId: trashChatMessagesBatch
      summary: Move many of my messages to trash
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  oneOf:
                    - type: array
                      items: { $ref: '#/components/schemas/ObjectId' }
                    - type: string
                      description: Comma separated ids.
                agentType: { $ref: '#/components/schemas/ChatAgentType' }
      responses:
        '200':
          description: Count of moved messages in the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
              example: { status: ok, message: 3 message(s) moved to trash }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
  /api/ai/chats/message/{messageId}:
    delete:
      tags: [AI chats]
      operationId: trashChatMessage
      summary: Move one of my messages to trash
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
        - $ref: '#/components/parameters/AgentTypeQuery'
      responses:
        '200':
          description: Moved (count 0 when the id was unknown).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }

  # ---------------------------------------------------------------------------
  # PATCH /api/ai/chats/message/{messageId}/restore
  # ---------------------------------------------------------------------------
  # PURPOSE    Brings a message back. Its chat is restored too, so the message is visible.
  # HLD        findOneAndUpdate({ _id, userId }, active) (missing: 404)
  #              --> Session.updateOne({ _id: message.sessionId, userId }, active) --> 200
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (restoreMessage)
  /api/ai/chats/message/{messageId}/restore:
