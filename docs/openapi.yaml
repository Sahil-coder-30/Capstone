  /ai/app-agent/invoke:
    post:
      tags: [AI Orchestration]
      summary: Invoke Application Planner Agent (SSE Stream)
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: |
        Streams reasoning, project blueprints, and architectural breakdowns via **Server-Sent Events (SSE)**.
        - **Content-Type**: `text/event-stream`.
        - **In-Stream Events**:
          - `event: message` or `event: agent:token` (Chunk data payload)
          - `event: agent:thinking` (Reasoning progress steps)
          - `event: error`: Emitted if token quota is burned out or provider fails mid-stream.
            Payload schema matches `#/components/schemas/SSEStreamErrorFrame`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userPrompt]
              properties:
                userPrompt: { type: string, example: "Build a real-time markdown editor with syntax highlighting" }
                message: { type: string, description: "Alias for userPrompt" }
                projectId: { type: string, example: "67cb1a2934..." }
                sessionId: { type: string, example: "67cb1a2934..." }
                sandboxId: { type: string, example: "123e4567-e89b-12d3-a456-426614174000" }
                workspacePath: { type: string, example: "/workspace" }
                activeFile: { type: string, example: "src/App.jsx" }
                activeFileContent: { type: string }
      responses:
        '200':
          description: Server-Sent Events stream established
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  : heartbeat

                  event: agent:thinking
                  data: {"content": "Analyzing application requirements and creating Vite scaffolding..."}

                  event: agent:token
                  data: {"token": "Here is the architectural plan for your editor..."}

                  event: error
                  data: {"message": "Insufficient mistral credits. Free users receive 20 credits per model company.", "code": "INSUFFICIENT_CREDITS", "company": "mistral"}
        '400':
          description: Missing prompt or malformed input before SSE connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized - Invalid user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '402':
          description: Insufficient AI credits (Pre-flight check rejected before SSE stream starts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsErrorResponse'
        '404':
          description: Project or sandbox container not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '429':
          description: Concurrent agent invocation limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
        '500':
          description: LangGraph graph instantiation or agent execution crash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: AI provider not configured or provider API outage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'

