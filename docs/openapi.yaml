        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }

  # ---------------------------------------------------------------------------
  # DELETE /api/ai/chats/message/{messageId}/permanent
  # ---------------------------------------------------------------------------
  # PURPOSE    Deletes one message for good (from anywhere, not only trash).
  # HLD        deleteOne({ _id, userId }) (nothing deleted: 404) --> 200
  # CODE       Ai_orchestration/src/controllers/chat.controller.js (deleteMessageForever)
  /api/ai/chats/message/{messageId}/permanent:
    delete:
      tags: [AI chats]
      operationId: deleteChatMessageForever
      summary: Permanently delete one of my messages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageIdPath'
        - $ref: '#/components/parameters/AgentTypeQuery'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }

  # ---------------------------------------------------------------------------
  # GET /api/ai/healthz and /api/ai/readyz
  # ---------------------------------------------------------------------------
  # PURPOSE    Probes of the AI service. Routed by the ingress (under /api/ai).
  # HLD        kubelet or browser --GET--> ai-service --> 200 (no dependency is checked)
  # CODE       Ai_orchestration/src/app/app.js
  /api/ai/healthz:
    get:
      tags: [Health]
      operationId: aiHealthz
      summary: AI service liveness
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
              example: { status: ok, message: AI service is healthy }
  /api/ai/readyz:
    get:
      tags: [Health]
      operationId: aiReadyz
      summary: AI service readiness
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
              example: { status: ok, message: AI service is ready }

  # ===========================================================================
  #  SANDBOX SERVER   (Sandbox/server/, container 3000, ingress /api/sandbox)
  #  Mongo "sandbox" (projects, mcptokens), Redis (sandbox:<id> idle key), Kubernetes API.
  #  identifyUser: Bearer only, JWKS by kid, RS256. NO blacklist check (accepted risk:
  #  a logged-out token can still manage its own sandboxes for up to 15 minutes).
  #  Ownership: getAuthorizedProject() loads the project and compares project.user with
  #  the token's id. 400 bad id, 404 missing, 403 someone else's.
  #  Errors: { status: "error", message }.
  #
  #  SANDBOX LIFECYCLE (one project = one sandboxId for its whole life)
  #
  #    create-project --> not_started --start--> building --> live --stop--> down --start--> ...
  #                                                  |          |
  #                                                  |          +-- idle: Redis key sandbox:<id>
  #                                                  |              expires (120 s after start, the
  #                                                  |              router refreshes it to 1200 s on
  #                                                  |              every preview / editor request)
  #                                                  |              --> keyspace event --> server
  #                                                  |              deletes pod + Service --> down
  #                                                  +-- pod create fails --> down
  #
  #    Pod sandbox-pod-<id>: init (seed template, restore from S3, chown) then containers
  #    template (Vite 5173), agent (sidecar 3000), sync-agent (S3 upload). Service sandbox-service-<id>.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # POST /api/sandbox/create-project
  # ---------------------------------------------------------------------------
  # PURPOSE    Creates a project record and gives it a sandboxId. No pod is started yet.
  # CALLED BY  Frontend dashboard "New project" (after POST /api/ai/app-agent/title).
  # AUTH       Bearer.
  # HLD
  #   Browser --POST /api/sandbox/create-project { title }--> Ingress --> sandbox-service
  #     identifyUser --> Project.find({ user }) count (trashed projects count too)
  #       >= 5 --> 400 "You can only create up to 5 projects"
  #     sandboxId = UUIDv7 --> Project.create({ user, title, sandboxId, status: not_started })
  #   <-- 201 { project, sandboxId }
  # NOTE       Projects in trash still use one of the 5 places. Delete them forever to free a place.
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (createProjectController)
  /api/sandbox/create-project:
    post:
      tags: [Sandbox projects]
      operationId: createProject
      summary: Create a project (max 5, trash included)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1 }
      responses:
        '201':
          description: Created, status `not_started`.
          content:
            application/json:
              schema:
                type: object
                required: [status, project, sandboxId]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Project created successfully }
                  project: { $ref: '#/components/schemas/Project' }
                  sandboxId: { $ref: '#/components/schemas/SandboxId' }
        '400':
          description: Missing title, or already 5 projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/sandbox/projects
  # ---------------------------------------------------------------------------
  # PURPOSE    The caller's projects (not in trash), newest first, with the REAL pod state.
  # CALLED BY  Frontend dashboard. Also the AI service (requireOwnedSandbox, 60 s cache) to
  #            check that a sandbox belongs to the caller.
  # AUTH       Bearer.
  # HLD
  #   Browser or ai-service --GET /api/sandbox/projects + Bearer--> sandbox-service
  #     Project.find({ user, deletionStatus != trash }) --> Mongo
  #     for each project in live or building, in parallel: K8s readNamespacedPod
  #        Running -> live, Pending -> building, missing or other -> down; save if changed
  #        K8s error -> keep the stored status
  #   <-- 200 { projects[] }
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (listAllProjectsController)
  /api/sandbox/projects:
    get:
      tags: [Sandbox projects]
      operationId: listProjects
      summary: My projects, reconciled with Kubernetes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                type: object
                required: [status, projects]
                properties:
                  status: { type: string, const: success }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/sandbox/projects/trash
  # ---------------------------------------------------------------------------
  # PURPOSE    The caller's projects in trash, most recently deleted first.
  # CALLED BY  Frontend trash page.
  # HLD        Project.find({ user, deletionStatus: trash }).sort(-deletedAt) --> 200 { projects[] }
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (listTrashProjectsController)
  /api/sandbox/projects/trash:
    get:
      tags: [Sandbox projects]
      operationId: listTrashProjects
      summary: My projects in trash
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trashed projects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # GET | DELETE /api/sandbox/project/{projectId}
  # ---------------------------------------------------------------------------
  # PURPOSE    GET: one project's status, checked against Kubernetes, with the preview URL.
  #            DELETE: soft delete, moves the project to trash.
  # CALLED BY  GET: Frontend editor while a sandbox starts (polling). DELETE: dashboard menu.
  # AUTH       Bearer + owner.
  # HLD (GET)
  #   Browser --GET /api/sandbox/project/<id>--> sandbox-service --> getAuthorizedProject
  #     K8s readNamespacedPod: Running live, Pending building, missing down (not_started stays),
  #     other down; K8s error keeps the stored status; a change is saved
  #   <-- 200 { project: { _id, title, status, sandboxId, previewUrl (only when live), createdAt } }
  # HLD (DELETE)
  #   getAuthorizedProject --> live or building: delete pod, Service, Redis key (errors ignored)
  #   --> deletionStatus trash, deletedAt now, status not_started --> revoke all MCP tokens
  #       (Mongo revokedAt + Redis mcptoken:<hash> deleted, so external agents lose access at once)
  #   <-- 200 { project }
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (getProjectStatusController,
  #            deleteProjectController), src/services/mcpTokens.service.js (revokeProjectTokens)
  /api/sandbox/project/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Sandbox projects]
      operationId: getProject
      summary: One of my projects, with live pod status
      description: '`previewUrl` is set only when the project is `live`. It is hardcoded to `http://<sandboxId>.preview.localhost`.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  project:
                    type: object
                    properties:
                      _id: { type: string }
                      title: { type: string }
                      status: { $ref: '#/components/schemas/ProjectStatus' }
                      sandboxId: { $ref: '#/components/schemas/SandboxId' }
                      previewUrl: { type: string, description: Empty unless live. }
                      createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }
    delete:
      tags: [Sandbox projects]
      operationId: trashProject
      summary: Move one of my projects to trash (stops its sandbox, revokes MCP tokens)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: In trash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Project moved to trash successfully }
                  project: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # PATCH /api/sandbox/project/{projectId}/restore
  # ---------------------------------------------------------------------------
  # PURPOSE    Takes a project out of trash. Its sandbox stays stopped; MCP tokens stay revoked.
  # CALLED BY  Frontend trash page.
  # HLD        getAuthorizedProject --> deletionStatus active, deletedAt null --> 200 { project }
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (restoreProjectController)
  /api/sandbox/project/{projectId}/restore:
    patch:
      tags: [Sandbox projects]
      operationId: restoreProject
      summary: Restore one of my projects from trash
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string }
                  project: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # DELETE /api/sandbox/project/{projectId}/permanent
  # ---------------------------------------------------------------------------
  # PURPOSE    Deletes the project record for good (from trash or not).
  # CALLED BY  Frontend trash page "Delete forever".
  # HLD        getAuthorizedProject --> delete pod, Service, Redis key (errors ignored)
  #            --> revoke MCP tokens --> Project.findByIdAndDelete --> 200
  # NOTE       The project's files in S3 are NOT deleted. Chats in the AI service are not deleted.
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (permanentlyDeleteProjectController)
  /api/sandbox/project/{projectId}/permanent:
    delete:
      tags: [Sandbox projects]
      operationId: deleteProjectForever
      summary: Permanently delete one of my projects
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/sandbox/start/{projectId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Starts (or restarts) the project's sandbox pod with its same sandboxId.
  # CALLED BY  Frontend dashboard "Open" and the editor when the project is down.
  # AUTH       Bearer + owner.
  # HLD
  #   Browser --POST /api/sandbox/start/<projectId>--> sandbox-service --> getAuthorizedProject
  #     live or building (pod may be dead) --> tear down pod, Service, key first
  #     status = building (Mongo)
  #     in parallel:
  #       K8s create Pod sandbox-pod-<id>  (init: template seed, S3 restore, chown;
  #                                         containers: Vite, sidecar with OWNER_USER_ID, sync-agent)
  #       K8s create Service sandbox-service-<id>  (80 -> 5173, 3000 -> 3000)
  #       Redis SET sandbox:<id> EX 120
  #     any failure --> status down, 500
  #     status = live (Mongo)  (the pod may still be Pending; GET project shows the real phase)
  #   <-- 200 { sandboxId, previewUrl }
  #   Browser then polls GET /api/sandbox/project/<id> until live, and opens
  #   http://<id>.preview.localhost (Vite) and http://<id>.agent.localhost (sidecar).
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (startSandboxController),
  #            src/services/sandboxLifecycle.service.js, src/kubernetes/pod.js, src/kubernetes/service.js
  /api/sandbox/start/{projectId}:
    post:
      tags: [Sandbox projects]
      operationId: startSandbox
      summary: Start my project's sandbox
      description: |
        Creates the pod, Service and idle key. Answers when Kubernetes accepted the objects,
        not when the app is ready: poll `GET /api/sandbox/project/{projectId}` until `live`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  message: { type: string }
                  previewUrl: { type: string, examples: ['http://019f2c3a-....preview.localhost'] }
                  sandboxId: { $ref: '#/components/schemas/SandboxId' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/sandbox/stop/{projectId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Stops a running sandbox. The project and its files (S3) stay.
  # CALLED BY  Frontend dashboard "Stop".
  # HLD        getAuthorizedProject --> status must be live (else 400)
  #            --> delete pod, Service, Redis key (errors ignored) --> status down --> 200
  # CODE       Sandbox/server/src/controllers/sandbox.controller.js (stopSandboxController)
  /api/sandbox/stop/{projectId}:
    post:
      tags: [Sandbox projects]
      operationId: stopSandbox
      summary: Stop my project's sandbox
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '400':
          description: Bad id, or the sandbox is not live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: 'Sandbox is not running (current status: down)' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # GET | POST /api/sandbox/project/{projectId}/mcp-tokens
  # ---------------------------------------------------------------------------
  # PURPOSE    The owner lists or creates tokens that let an external agent (Claude Code,
  #            Cursor) use this project through the MCP gateway.
  # CALLED BY  Frontend editor header, plug icon, ConnectAgentModal.
  # AUTH       Bearer + owner.
  # HLD (POST)
  #   Browser --POST .../mcp-tokens { name, scopes, expiresInDays }--> sandbox-service
  #     getAuthorizedProject; project in trash --> 400
  #     normalize: name 1..60, scopes subset of read|write|exec (read always added), days 1..90
  #     active tokens >= 10 --> 400
  #     token = "tks_mcp_" + random; store SHA-256 hash, prefix, scopes, expiresAt --> Mongo mcptokens
  #     Redis SET mcptoken:<hash> <record> PXAT expiresAt (the gateway's cache)
  #   <-- 201 { token (shown ONCE), mcpUrl, record }
  #   The user pastes mcpUrl + token into the agent's MCP config (see POST /api/mcp/{sandboxId}).
  # HLD (GET)  active tokens (not revoked, not expired) + lastUsedAt from Redis mcptoken-used:<id>
  #            <-- 200 { mcpUrl, tokens[] } (never the token itself)
  # CODE       Sandbox/server/src/controllers/mcpToken.controller.js, src/services/mcpTokens.service.js
  /api/sandbox/project/{projectId}/mcp-tokens:
    parameters:
      - $ref: '#/components/parameters/ProjectIdPath'
    get:
      tags: [Sandbox MCP tokens]
      operationId: listMcpTokens
      summary: List the active MCP tokens of my project
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens (without the secret) and the project's MCP URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  mcpUrl: { type: string, format: uri, examples: ['http://localhost/api/mcp/019f2c3a-...'] }
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/McpTokenView' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }
    post:
      tags: [Sandbox MCP tokens]
      operationId: createMcpToken
      summary: Create an MCP token for an external agent (shown once)
      description: |
        `read` is always included. `write` lets the agent change files, `exec` lets it run
        shell commands: ask for them only when needed. At most 10 active tokens per project.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60, examples: [Claude Code on laptop] }
                scopes:
                  type: array
                  items: { $ref: '#/components/schemas/McpScope' }
                  description: '`read` is added if missing.'
                expiresInDays: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        '201':
          description: Created. Store `token` now; it is never shown again.
          content:
            application/json:
              schema:
                type: object
                required: [status, token, mcpUrl, record]
                properties:
                  status: { type: string, const: success }
                  token: { type: string, pattern: '^tks_mcp_[A-Za-z0-9_-]+$' }
                  mcpUrl: { type: string, format: uri }
                  record: { $ref: '#/components/schemas/McpTokenView' }
        '400':
          description: Bad name, scopes or days; 10 tokens already; or the project is in trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404': { $ref: '#/components/responses/SandboxNotFound' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # DELETE /api/sandbox/project/{projectId}/mcp-tokens/{tokenId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Revokes one MCP token at once.
  # CALLED BY  ConnectAgentModal "Revoke".
  # HLD        getAuthorizedProject --> set revokedAt (only an active token of THIS project)
  #            --> Redis DEL mcptoken:<hash>, mcptoken-used:<id> --> 200
  #            The next gateway call with that token gets 401. (The router may still hold a
  #            scoped sandbox token for it, at most 10 minutes, but the gateway checks the
  #            MCP token first on every call.)
  # CODE       Sandbox/server/src/controllers/mcpToken.controller.js (revokeMcpTokenController)
  /api/sandbox/project/{projectId}/mcp-tokens/{tokenId}:
    delete:
      tags: [Sandbox MCP tokens]
      operationId: revokeMcpToken
      summary: Revoke one MCP token of my project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: tokenId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/SandboxUnauthorized' }
        '403': { $ref: '#/components/responses/SandboxForbidden' }
        '404':
          description: Project not found, or no active token with this id in it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '500': { $ref: '#/components/responses/SandboxServerError' }

  # ---------------------------------------------------------------------------
  # GET /internal/mcp-tokens/{hash}   (Sandbox server)
  # ---------------------------------------------------------------------------
  # PURPOSE    Token record for the gateway when Redis has no cached copy.
  # CALLED BY  Router MCP gateway (resolveToken) on a cache miss.
  # AUTH       X-Internal-Token.
  # HLD        router --GET http://sandbox-service/internal/mcp-tokens/<sha256>--> sandbox-service
  #              hash not 64 hex, or no active token --> 404
  #              found --> write Redis mcptoken:<hash> again --> 200 { token: record }
  # CODE       Sandbox/server/src/controllers/mcpToken.controller.js (lookupMcpTokenController)
  /internal/mcp-tokens/{hash}:
    servers:
      - url: http://sandbox-service
        description: In-cluster only.
    get:
      tags: [Internal, Sandbox MCP tokens]
      operationId: internalLookupMcpToken
      summary: Look up an active MCP token by its SHA-256 hash
      security:
        - internalToken: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Active token record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  token: { $ref: '#/components/schemas/McpTokenRecord' }
        '401': { $ref: '#/components/responses/InternalUnauthorized' }
        '404':
          description: Unknown, revoked or expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '503': { $ref: '#/components/responses/InternalNotConfigured' }

  # ---------------------------------------------------------------------------
  # POST /internal/sandboxes/{sandboxId}/wake   (Sandbox server)
  # ---------------------------------------------------------------------------
  # PURPOSE    Starts a stopped sandbox so an external agent's call can go through.
  # CALLED BY  Router MCP gateway (ensureRunning) when Redis has no sandbox:<id> key.
  # AUTH       X-Internal-Token.
  # HLD
  #   router --POST http://sandbox-service/internal/sandboxes/<id>/wake--> sandbox-service
  #     no active project with this sandboxId --> 404
  #     live and key exists --> 200 { state: live }
  #     building            --> 202 { state: starting }
  #     else startProjectSandbox (same as POST /api/sandbox/start) --> 202 { state: starting }
  #   router then polls the sidecar's /api/agent/ready every 1.5 s, up to 45 s.
  # CODE       Sandbox/server/src/controllers/mcpToken.controller.js (wakeSandboxController)
  /internal/sandboxes/{sandboxId}/wake:
    servers:
      - url: http://sandbox-service
        description: In-cluster only.
    post:
      tags: [Internal, Sandbox projects]
      operationId: internalWakeSandbox
      summary: Start a stopped sandbox for the MCP gateway
      security:
        - internalToken: []
      parameters:
        - $ref: '#/components/parameters/SandboxIdPath'
      responses:
        '200':
          description: Already live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  state: { type: string, const: live }
        '202':
          description: Starting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  state: { type: string, const: starting }
        '400': { $ref: '#/components/responses/SandboxBadRequest' }
        '401': { $ref: '#/components/responses/InternalUnauthorized' }
        '404':
          description: No active (non-trash) project for this sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '500': { $ref: '#/components/responses/SandboxServerError' }
        '503': { $ref: '#/components/responses/InternalNotConfigured' }

  # ---------------------------------------------------------------------------
  # GET /api/sandbox/health and /api/sandbox/ready
  # ---------------------------------------------------------------------------
  # PURPOSE    Probes of the Sandbox server. Routed by the ingress. No dependency checked.
  # CODE       Sandbox/server/src/app/app.js
  /api/sandbox/health:
    get:
      tags: [Health]
      operationId: sandboxHealth
      summary: Sandbox server liveness
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
              example: { status: ok, message: Sandbox API is working fine }
  /api/sandbox/ready:
    get:
      tags: [Health]
      operationId: sandboxReady
      summary: Sandbox server readiness
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  message: { type: string }

  # ===========================================================================
  #  ROUTER   (Sandbox/router/, container 3000)
  #  1. MCP gateway at /api/mcp/<sandboxId> (ingress path /api/mcp).
  #  2. Host based reverse proxy for every sandbox (no path of its own, so not an OpenAPI path):
  #       Host <id>.preview.localhost --> refreshTTL --> http://sandbox-service-<id>      (Vite)
  #       Host <id>.agent.localhost   --> refreshTTL --> http://sandbox-service-<id>:3000 (sidecar)
  #     refreshTTL = Redis EXPIRE sandbox:<id> 1200 on every HTTP request and WebSocket upgrade,
  #     so an open preview or editor keeps the sandbox alive. The id must be one DNS label,
  #     so a Host header can never point the proxy at another internal host.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # POST /api/mcp/{sandboxId}
  # ---------------------------------------------------------------------------
  # PURPOSE    Public MCP endpoint for external agents (Claude Code, Cursor, any MCP client):
  #            they use the project's tools (read files, patch, run commands) like Orion does.
  # CALLED BY  The user's own agent, configured with mcpUrl + tks_mcp_ token from
  #            POST /api/sandbox/project/{projectId}/mcp-tokens.
  # AUTH       Authorization: Bearer tks_mcp_<token>. Stateless Streamable HTTP, POST only.
  # HLD
  #
  #   External agent       router mcpGateway                 Sandbox server     Auth          sidecar
  #     | POST /api/mcp/<id>  |                                    |               |               |
  #     | Bearer tks_mcp_...  |                                    |               |               |
  #     |-------------------->| 1 token format + sha256            |               |               |
  #     |                     |   Redis GET mcptoken:<hash>        |               |               |
  #     |                     |   miss --GET /internal/mcp-tokens/<hash>--------->|               |
  #     |                     |   expired / revoked -> 401         |               |               |
  #     |                     |   token for another sandbox -> 403 |               |               |
  #     |                     | 2 Redis INCR mcp-rate:<token>:<min>  > 120 -> 429 |               |
  #     |                     | 3 Redis EXISTS sandbox:<id>        |               |               |
  #     |                     |   missing --POST /internal/sandboxes/<id>/wake --->|               |
  #     |                     |   poll GET <sidecar>/api/agent/ready, max 45 s -> 503 on timeout   |
  #     |                     | 4 POST /internal/sandbox-token { scopes, ttl 600 } --------------->|
  #     |                     |   (cached until 60 s before expiry)                |               |
  #     |                     | 5 refreshTTL, record lastUsed (Redis, at most once a minute)      |
  #     |                     | 6 proxy to http://sandbox-service-<id>:3000/mcp ------------------>|
  #     |                     |   Authorization replaced by the scoped sandbox token;              |
  #     |                     |   cookies and X-Internal-Token stripped                            |
  #     |                     |                                                    sidecar: scoped token,
  #     |                     |                                                    tools filtered by scope
  #     |<--------------------| JSON-RPC result (proxy timeout 180 s)              |               |
  #
  # FAILURES   All JSON-RPC errors (code -32000): 401 missing / bad token (WWW-Authenticate),
  #            403 other project, 404 bad sandbox id, 405 not POST (Allow: POST), 429 rate limit
  #            (Retry-After 60), 502 a service did not answer, 503 sandbox still starting (Retry-After 15).
  # CODE       Sandbox/router/src/mcpGateway.js, Sandbox/router/src/app.js
  /api/mcp/{sandboxId}:
    post:
      tags: [MCP gateway]
      operationId: mcpGateway
      summary: MCP endpoint for external agents (JSON-RPC)
      description: |
        Send MCP JSON-RPC requests (`initialize`, `tools/list`, `tools/call`) with
        `Accept: application/json, text/event-stream`. The server is stateless, so no
        session id is needed. Which tools appear depends on the token's scopes (see
        `POST /mcp` on the sidecar). A stopped sandbox is started automatically; the first
        call can take up to 45 seconds or answer 503 with `Retry-After`.
      security:
        - mcpToken: []
      parameters:
        - $ref: '#/components/parameters/SandboxIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonRpcRequest' }
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/call
              params: { name: read_file, arguments: { files: [src/App.jsx] } }
      responses:
        '200':
          description: JSON-RPC response from the sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
        '401': { $ref: '#/components/responses/JsonRpcUnauthorized' }
        '403': { $ref: '#/components/responses/JsonRpcError' }
        '404': { $ref: '#/components/responses/JsonRpcError' }
        '405': { $ref: '#/components/responses/JsonRpcError' }
        '429':
          description: More than 120 calls in a minute for this token.
          headers:
            Retry-After: { schema: { type: integer, const: 60 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcErrorBody' }
        '502': { $ref: '#/components/responses/JsonRpcError' }
        '503':
          description: The sandbox is starting.
          headers:
            Retry-After: { schema: { type: integer, const: 15 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcErrorBody' }

  # ---------------------------------------------------------------------------
  # GET /api/router/health and /api/router/ready
  # ---------------------------------------------------------------------------
  # PURPOSE    Probes of the router. Not routed by the ingress (no /api/router rule).
  # CODE       Sandbox/router/src/app.js
  /api/router/health:
    servers:
      - url: http://router-service
        description: In-cluster only.
    get:
      tags: [Health]
      operationId: routerHealth
      summary: Router liveness
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
  /api/router/ready:
    servers:
      - url: http://router-service
        description: In-cluster only.
    get:
      tags: [Health]
      operationId: routerReady
      summary: Router readiness
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  message: { type: string }

  # ===========================================================================
  #  SANDBOX SIDECAR   (Sandbox/Agent/, the "agent" container in every sandbox pod, port 3000)
  #  Reached as http://sandbox-service-<id>:3000 inside the cluster, or through the router as
  #  http://<id>.agent.localhost (Frontend dev: /api/agent-proxy with header x-sandbox-id).
  #  requireOwner on everything except health, ready and report-error:
  #    owner access token (sub == OWNER_USER_ID, aud takshacodespace-services) or
  #    sandbox token (aud taksha-sandbox, sbx == SANDBOX_ID). A token with a "scope" claim
  #    (external agent) may only use /mcp.
  #  Also served (not HTTP APIs, so not paths here):
  #    Socket.IO on the same port, handshake auth.token = owner token (scoped tokens refused):
  #      client -> server: terminal-input, terminal-resize
  #      server -> client: terminal-output (pty + browser error reports), workspace-change
  #                        { event: add|change|unlink|addDir|unlinkDir, path } from chokidar
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # POST /mcp   (sidecar)
  # ---------------------------------------------------------------------------
  # PURPOSE    The sandbox's MCP server: the ONLY way to read and change project files and
  #            run commands. Used by Orion, Clio, the Frontend editor and external agents.
  # CALLED BY
  #   ai-service tools/sandbox.client.js   http://sandbox-service-<id>:3000/mcp, 2 h sandbox token
  #   Frontend sandboxAgentClient.js       http://<id>.agent.localhost/mcp, owner access token
  #                                        (editor, file tree, logs panel)
  #   router MCP gateway                   10 min scoped sandbox token (external agents)
  # HLD
  #   caller --POST /mcp JSON-RPC--> sidecar
  #     requireOwner (JWKS, owner or sandbox token)                 else 401 / 403
  #     Host must be sandbox-service-<id>[:3000], <id>.agent.localhost, localhost:3000 or
  #       MCP_ALLOWED_HOSTS (DNS rebinding protection)
  #     new McpServer per request (stateless), register the 9 certified tools,
  #       only the token's scopes for a scoped token
  #     tools/call --> tool.call(args) picks the handler --> invokeRoute (150 s limit)
  #       file tools --> safeResolve (inside /workspace, symlinks checked) --> fs
  #       execute_command --> shell guard (no file commands, no dev servers) --> exec in /workspace
  #       get_vite_runtime_errors --> tail of /sandbox-logs/vite.log
  #     one log line per call: [MCP] tool=<name> <paths> -> ok | error <ms>
  #   <-- JSON-RPC result { content: [{ type: text, text: <JSON> }], isError }
  #
  #   Certified tools (frozen list):
  #     read  list_files {}                              read_file { files[1..10] }
  #           search_code { pattern, isRegex?, caseSensitive?, fileGlob?, contextLines? 0..5,
  #                         maxResults? 1..50, filesOnly? }   (fileGlob is a substring match)
  #           get_vite_runtime_errors {}
  #     write create_file { files[{ file, content }] }   update_file { updates[{ file, content }] }
  #           patch_file { filePath, oldStr, newStr }    delete_file { files[] }
  #     exec  execute_command { command, subDir? }       (30 s, 120 s for installs and builds)
  # CODE       Sandbox/Agent/src/mcp/server.js, src/mcp/tools.js, src/mcp/invokeRoute.js,
  #            src/controllers/*.js, src/middleware/auth.middleware.js
  /mcp:
    servers:
      - url: http://sandbox-service-{sandboxId}:3000
        description: In-cluster (AI service, router gateway).
        variables:
          sandboxId: { default: 019f2c3a-0000-7000-8000-000000000000 }
      - url: http://{sandboxId}.agent.localhost
        description: Through the router (Frontend editor).
        variables:
          sandboxId: { default: 019f2c3a-0000-7000-8000-000000000000 }
    post:
      tags: [Sandbox sidecar]
      operationId: sidecarMcp
      summary: Sandbox MCP server (JSON-RPC, certified tools)
      description: |
        Stateless MCP Streamable HTTP with JSON responses. Send `Accept: application/json, text/event-stream`.
        `tools/list` shows the tools the token may use. A tool result is a text content part
        holding JSON. `isError: true` with `{ error: true, message }` or `{ status: "error" }`
        means the request failed; other `isError: true` results are a tool answer such as
        "oldStr not found".

        | Scope | Tools |
        |---|---|
        | read | `list_files`, `read_file`, `search_code`, `get_vite_runtime_errors` |
        | write | `create_file`, `update_file`, `patch_file`, `delete_file` |
        | exec | `execute_command` |
      security:
        - bearerAuth: []
        - sandboxToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JsonRpcRequest' }
            example:
              jsonrpc: '2.0'
              id: 7
              method: tools/call
              params: { name: patch_file, arguments: { filePath: src/App.jsx, oldStr: 'Hello', newStr: 'Hi' } }
      responses:
        '200':
          description: JSON-RPC response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonRpcResponse' }
              example:
                jsonrpc: '2.0'
                id: 7
                result:
                  content: [{ type: text, text: '{"success":true,"patched":"src/App.jsx"}' }]
                  isError: false
        '401': { $ref: '#/components/responses/SidecarUnauthorized' }
        '403': { $ref: '#/components/responses/SidecarForbidden' }
        '500': { $ref: '#/components/responses/JsonRpcError' }
    get:
      tags: [Sandbox sidecar]
      operationId: sidecarMcpGet
      summary: Not allowed (stateless server, no SSE stream)
      security:
        - bearerAuth: []
        - sandboxToken: []
      responses:
        '405': { $ref: '#/components/responses/JsonRpcError' }
    delete:
      tags: [Sandbox sidecar]
      operationId: sidecarMcpDelete
      summary: Not allowed (stateless server, no session to delete)
      security:
        - bearerAuth: []
        - sandboxToken: []
      responses:
        '405': { $ref: '#/components/responses/JsonRpcError' }

  # ---------------------------------------------------------------------------
  # POST /api/agent/report-error   (sidecar, open route)
  # ---------------------------------------------------------------------------
  # PURPOSE    The user's preview app reports browser errors so they show in the editor terminal.
  # CALLED BY  Script injected by the project's vite.config.js (window.onerror,
  #            unhandledrejection, console.error), through the Vite proxy on port 5173.
  # AUTH       None: the preview app has no token. Input is untrusted.
  # HLD
  #   preview page --fetch /api/agent/report-error--> Vite :5173 proxy --> sidecar :3000
  #     rate limit 30 per minute per sandbox --> 429
  #     clean fields: control characters removed (no escape codes reach the terminal), 2000 chars max
  #     log it, and emit "terminal-output" (coloured) to every editor socket
  #   <-- 200 { status: ok }
  # NOTE       Vite proxies only this one path, so the rest of the sidecar is not exposed on
  #            the public preview URL.
  # CODE       Sandbox/Agent/src/controllers/logs.controller.js (reportError), src/workspace/errorReports.js,
  #            Sandbox/template/vite.config.js
  /api/agent/report-error:
    servers:
      - url: http://{sandboxId}.preview.localhost
        description: From the preview app, through Vite's proxy.
        variables:
          sandboxId: { default: 019f2c3a-0000-7000-8000-000000000000 }
    post:
      tags: [Sandbox sidecar]
      operationId: sidecarReportError
      summary: Report a browser error from the preview app (open, rate limited)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [runtime, promise, console], maxLength: 20 }
                message: { type: string, maxLength: 2000 }
                source: { type: string, maxLength: 2000 }
                line: { type: integer }
                col: { type: integer }
                stack: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '200':
          description: Received.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
        '429':
          description: More than 30 reports in a minute for this sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }

  # ---------------------------------------------------------------------------
  # GET /api/agent/health and /api/agent/ready   (sidecar, open)
  # ---------------------------------------------------------------------------
  # PURPOSE    Pod probes, and the router's wake check (polls /ready every 1.5 s).
  # CODE       Sandbox/Agent/src/app/app.js
  /api/agent/health:
    servers:
      - url: http://sandbox-service-{sandboxId}:3000
        variables:
          sandboxId: { default: 019f2c3a-0000-7000-8000-000000000000 }
    get:
      tags: [Health, Sandbox sidecar]
      operationId: sidecarHealth
      summary: Sidecar liveness
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
  /api/agent/ready:
    servers:
      - url: http://sandbox-service-{sandboxId}:3000
        variables:
          sandboxId: { default: 019f2c3a-0000-7000-8000-000000000000 }
    get:
      tags: [Health, Sandbox sidecar]
      operationId: sidecarReady
      summary: Sidecar readiness (used by the MCP gateway wake)
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  message: { type: string }

# =============================================================================
#  COMPONENTS: shared schemas, parameters, responses and security schemes
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Security schemes: one per kind of credential (see "TOKENS" at the top)
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /api/auth/refresh`. RS256, `kid: auth-rsa-v1`,
        `aud: takshacodespace-services`, 15 minutes. Keep it in memory only.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Opaque refresh token. httpOnly, path `/api/auth`, 30 days, rotated on every use.
    sandboxToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Sandbox token from Auth (`aud: taksha-sandbox`, claim `sbx`). Accepted only by the sandbox
        sidecar of that sandbox. Tokens with a `scope` claim may only call `/mcp`.
    mcpToken:
      type: http
      scheme: bearer
      bearerFormat: tks_mcp_<random>
      description: MCP token made by the project owner. Accepted only by the router MCP gateway.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared `INTERNAL_SERVICE_TOKEN`. Only for `/internal/*`, which the ingress never routes.
    razorpaySignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: HMAC-SHA256 of the raw webhook body with `RAZORPAY_WEBHOOK_SECRET`.

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starts at 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size, clamped to 1..100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      description: Mongo id of the project (Sandbox server `projects._id`).
      schema: { $ref: '#/components/schemas/ObjectId' }
    SandboxIdPath:
      name: sandboxId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SandboxId' }
    AgentTypePath:
      name: agentType
      in: path
      required: true
      description: '`codingAgent` (Orion) or `copilot` (Clio). Anything else is a 400.'
      schema: { $ref: '#/components/schemas/ChatAgentType' }
    AgentTypeQuery:
      name: agentType
      in: query
      description: Which agent's messages. Default `codingAgent`.
      schema: { $ref: '#/components/schemas/ChatAgentType' }
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    MessageIdPath:
      name: messageId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }

  # ---------------------------------------------------------------------------
  # Headers
  # ---------------------------------------------------------------------------
  headers:
    XRateLimitLimit:
      description: Bucket size of the caller's tier (free 20, pro and max 60).
      schema: { type: integer }
    XRateLimitRemaining:
      description: Requests left in the bucket right now.
      schema: { type: integer }

  # ---------------------------------------------------------------------------
  # Responses, grouped by error format
  # ---------------------------------------------------------------------------
  responses:
    # Auth service: { status: "error", message }
    AuthUnauthorized:
      description: No token, revoked token (logged out), or bad / expired token. Refresh once, then log in.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          examples:
            missing: { value: { status: error, message: 'Unauthorized: No token provided' } }
            revoked: { value: { status: error, message: 'Unauthorized: Token has been revoked' } }
            invalid: { value: { status: error, message: 'Unauthorized: Invalid or expired token' } }
    AuthBadRequest:
      description: The body does not fit the schema (for example a theme that is not dark, light or system).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
    AuthServerError:
      description: Unexpected error. The message is generic in production.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: Internal server error }

    # /internal/* on Auth and Sandbox server
    InternalUnauthorized:
      description: X-Internal-Token missing or wrong.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: Unauthorized internal call }
    InternalNotConfigured:
      description: INTERNAL_SERVICE_TOKEN is not set on the service (fails closed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: Internal calls are not configured }

    # Payments and AI: FaultKit
    FaultBadRequest:
      description: Invalid input. `error.code` is `BAD_REQUEST` or `VALIDATION_ERROR`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultUnauthorized:
      description: |
        `UNAUTHORIZED` (no token, revoked), `TOKEN_EXPIRED` (refresh and retry) or
        `TOKEN_INVALID` (bad signature, unknown kid).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
          example:
            success: false
            error: { code: TOKEN_EXPIRED, message: Access token expired. Please refresh., details: null, requestId: 4f1c... }
            requestId: 4f1c...
    FaultInsufficientCredits:
      description: |
        `INSUFFICIENT_CREDITS`. The 5-hour credit window is used up. `error.details` has
        `creditsRemaining`, `windowCreditsTotal`, `timeUntilRefillMs`, `subscription`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultForbidden:
      description: '`FORBIDDEN`. The resource belongs to another user (another order, sandbox or account).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultNotFound:
      description: '`NOT_FOUND`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultConflict:
      description: '`CONFLICT`. For chats: Orion is still working in this chat, stop it first.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultRateLimited:
      description: '`RATE_LIMIT_EXCEEDED`. Wait `Retry-After` seconds.'
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultServiceUnavailable:
      description: |
        `SERVICE_UNAVAILABLE`. A dependency is down: Auth JWKS, Redis (Payments money writes),
        Razorpay, or the Sandbox service (AI ownership check). Retry later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }
    FaultServerError:
      description: '`INTERNAL_SERVER_ERROR`. Generic message; quote `requestId` when reporting.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FaultError' }

    # AI run control
    AiNoActiveRun:
      description: No Orion run for this user and project.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodedError' }
          example: { status: error, code: NO_ACTIVE_RUN, message: No active Orion run for this project }
    AiNoPlanPending:
      description: The run is not paused for plan review.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CodedError' }
          example: { status: error, code: NO_PLAN_PENDING, message: No plan is waiting for review }

    # Sandbox server: { status: "error", message }
    SandboxBadRequest:
      description: Invalid id format or invalid input.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: Invalid project ID format }
    SandboxUnauthorized:
      description: Missing, bad or expired Bearer token. `expired` is true when it only needs a refresh.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PlainError'
              - type: object
                properties:
                  expired: { type: boolean }
    SandboxForbidden:
      description: The project belongs to another user.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: You are not authorized to perform this action }
    SandboxNotFound:
      description: No project with this id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: Project not found }
    SandboxServerError:
      description: Kubernetes, Mongo or Redis error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }

    # Sidecar REST guard
    SidecarUnauthorized:
      description: Not the owner's token and not a sandbox token for this sandbox. `WWW-Authenticate` is set.
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
    SidecarForbidden:
      description: A scoped token (external agent) on a route other than `/mcp`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlainError' }
          example: { status: error, message: This token only works for the MCP endpoint. }

    # JSON-RPC (router gateway, sidecar /mcp)
    JsonRpcError:
      description: JSON-RPC error body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonRpcErrorBody' }
    JsonRpcUnauthorized:
      description: Missing, invalid, expired or revoked MCP token.
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JsonRpcErrorBody' }
          example:
            jsonrpc: '2.0'
            error: { code: -32000, message: 'This MCP token is invalid, expired or revoked.' }
            id: null

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # --- shared ---------------------------------------------------------------
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      description: MongoDB ObjectId.
    SandboxId:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,46}[a-z0-9])?$'
      description: UUIDv7 given at project creation. Used in pod, Service and host names.
      examples: [019f2c3a-7b1e-7c4d-9a2b-3c4d5e6f7a8b]
    PlainError:
      type: object
      required: [status, message]
      properties:
        status: { type: string, const: error }
        message: { type: string }
    CodedError:
      type: object
      required: [status, code, message]
      properties:
        status: { type: string, const: error }
        code: { type: string }
        message: { type: string }
    OkMessage:
      type: object
      properties:
        status: { type: string, const: ok }
        message: { type: string }
    SuccessMessage:
      type: object
      properties:
        status: { type: string, const: success }
        message: { type: string }
    FaultError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, VALIDATION_ERROR, UNAUTHORIZED, TOKEN_EXPIRED, TOKEN_INVALID,
                     INSUFFICIENT_CREDITS, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMIT_EXCEEDED,
                     INTERNAL_SERVER_ERROR, SERVICE_UNAVAILABLE]
            message: { type: string }
            details: { description: 'Extra data, or null.' }
            requestId: { type: string }
        requestId: { type: string }

    # --- auth -----------------------------------------------------------------
    User:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        googleId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        photo: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProfileInput:
      type: object
      properties:
        linkedin: { type: string }
        github: { type: string }
        twitter: { type: string }
        website: { type: string }
        bio: { type: string }
        location: { type: string }
        company: { type: string }
        jobTitle: { type: string }
        skills: { type: array, items: { type: string } }
        experienceYears: { type: number }
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - type: object
          properties:
            _id: { $ref: '#/components/schemas/ObjectId' }
            userId: { $ref: '#/components/schemas/ObjectId' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PreferencesInput:
      type: object
      properties:
        theme: { type: string, enum: [dark, light, system] }
        editor:
          type: object
          properties:
            fontSize: { type: string, examples: [14px] }
            tabSize: { type: string, examples: ['2'] }
            autoSave: { type: boolean }
            minimap: { type: boolean }
            wordWrap: { type: boolean }
        copilot:
          type: object
          properties:
            modelPreference: { type: string, description: Stored only. The AI service does not read it. }
            autoSuggest: { type: boolean }
            interactiveMode: { type: string, enum: [concise, detailed] }
        notifications:
          type: object
          properties:
            emailLogins: { type: boolean }
            securityAlerts: { type: boolean }
    Preferences:
      allOf:
        - $ref: '#/components/schemas/PreferencesInput'
        - type: object
          properties:
            _id: { $ref: '#/components/schemas/ObjectId' }
            userId: { $ref: '#/components/schemas/ObjectId' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, const: RSA }
              use: { type: string, const: sig }
              alg: { type: string, const: RS256 }
              kid: { type: string, const: auth-rsa-v1 }
              n: { type: string }
              e: { type: string }

    # --- payments -------------------------------------------------------------
    Tier:
      type: string
      enum: [free, pro, max]
    AgentType:
      type: string
      enum: [codingAgent, copilot, appAgent, title, memory, unknown]
    TransactionType:
      type: string
      enum: [SUBSCRIPTION_ACTIVATION, SUBSCRIPTION_EXTENSION, SUBSCRIPTION_QUEUED, SUBSCRIPTION_PROMOTED,
             SUBSCRIPTION_EXPIRED, PAYMENT_FAILED, PAYMENT_REFUNDED, PAYMENT_DUPLICATE]
    Package:
      type: object
      properties:
        id: { type: string, enum: [free, pro_regular, max_regular] }
        label: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        pricingModel: { type: string, enum: [free, regular] }
        priceINR: { type: number, examples: [499] }
        description: { type: string }
        highlights: { type: array, items: { type: string } }
        badge: { type: [string, 'null'] }
        popular: { type: boolean }
    TierConfig:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Tier' }
        label: { type: string }
        billing: { type: string, const: credits }
        dailyTokenCap: { type: [integer, 'null'] }
        monthlyTokenCap: { type: [integer, 'null'] }
        requestsPerMinute: { type: integer }
        features: { type: object, additionalProperties: { type: boolean } }
        windowCredits: { type: integer, description: 'Credits per window: free 20, pro 150, max 200.' }
        windowHours: { type: integer, const: 5 }
        creditLowerLimit: { type: integer, description: Below this the window locks until refill. }
    CreditCheck:
      type: object
      properties:
        canQuery: { type: boolean }
        hasCredit: { type: boolean, description: Same as canQuery. }
        subscription: { $ref: '#/components/schemas/Tier' }
        creditsRemaining: { type: number }
        windowCreditsTotal: { type: number }
        creditLowerLimit: { type: integer }
        nextRefillAt: { type: [string, 'null'], format: date-time }
        windowExhaustedAt: { type: [string, 'null'], format: date-time }
        timeUntilRefillMs: { type: [integer, 'null'] }
    CreditView:
      type: object
      properties:
        userId: { type: string }
        accountId: { type: string }
        subscription: { $ref: '#/components/schemas/Tier' }
        credits: { type: number }
        canQuery: { type: boolean }
        windowCreditsTotal: { type: number }
        windowCreditsRemaining: { type: number }
        windowRefillAt: { type: [string, 'null'], format: date-time }
        windowExhaustedAt: { type: [string, 'null'], format: date-time }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
        providerCredits:
          type: array
          description: Usage per provider. All providers share the one window.
          items:
            type: object
            properties:
              company: { type: string }
              creditsRemaining: { type: number }
              creditsGranted: { type: number }
              promptTokens: { type: integer }
              completionTokens: { type: integer }
              totalTokens: { type: integer }
              requestCount: { type: integer }
              creditsUsed: { type: number }
              lastUsedAt: { type: [string, 'null'], format: date-time }
        billing:
          type: object
          properties:
            currency: { type: string, const: INR }
            currentPeriodStart: { type: [string, 'null'], format: date-time }
            currentPeriodEnd: { type: [string, 'null'], format: date-time }
        tokensPerCredit: { type: integer, default: 1000 }
        tierConfig: { $ref: '#/components/schemas/TierConfig' }
    UsageInput:
      type: object
      properties:
        userId: { type: string, description: "Optional. Must equal the token's user, else 403." }
        requestId: { type: string, maxLength: 200, description: 'Idempotency key, for example orion:<runId>. Random if missing.' }
        company: { type: string, description: 'Provider: nvidia. Anything else is stored as unknown.' }
        provider: { type: string, description: Alias of company. }
        modelId: { type: string, maxLength: 200 }
        agentType: { $ref: '#/components/schemas/AgentType' }
        projectId: { type: string, maxLength: 200 }
        chatId: { type: string, maxLength: 200, description: Chat session id. }
        promptTokens: { type: integer, minimum: 0, maximum: 2147483647 }
        completionTokens: { type: integer, minimum: 0, maximum: 2147483647 }
        totalTokens: { type: integer, minimum: 0, description: Default prompt + completion. Never less than that. }
    Transaction:
      type: object
      properties:
        _id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        accountId: { type: string }
        userId: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        amountPaise: { type: integer }
        amountINR: { type: number }
        currency: { type: string }
        razorpay:
          type: object
          properties:
            orderId: { type: [string, 'null'] }
            paymentId: { type: [string, 'null'] }
        subscription:
          type: object
          properties:
            plan: { type: [string, 'null'] }
            billingCycle: { type: [string, 'null'] }
        invoiceNumber: { type: [string, 'null'] }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    UsageEvent:
      type: object
      properties:
        _id: { type: string }
        id: { type: string }
        accountId: { type: string }
        company: { type: string }
        provider: { type: string }
        modelId: { type: string }
        agentType: { $ref: '#/components/schemas/AgentType' }
        projectId: { type: string }
        requestId: { type: string }
        chatId: { type: [string, 'null'] }
        subscription: { $ref: '#/components/schemas/Tier' }
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        totalTokens: { type: integer }
        creditsDeducted: { type: number }
        creditsDiscounted: { type: number, description: Credits the platform paid (memory agent). }
        createdAt: { type: string, format: date-time }
    UsageAnalytics:
      type: object
      properties:
        timeframeDays: { type: integer }
        totals:
          type: object
          properties:
            totalTokens: { type: integer }
            promptTokens: { type: integer }
            completionTokens: { type: integer }
            totalRequests: { type: integer }
            totalCreditsDeducted: { type: number }
            totalCreditsDiscounted: { type: number }
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              date: { type: string }
        byProvider:
          type: array
          items:
            type: object
            properties:
              company: { type: string }
              totalTokens: { type: integer }
              requestCount: { type: integer }
              creditsDeducted: { type: number }
        byAgent:
          type: array
          items:
            type: object
            properties:
              agentType: { $ref: '#/components/schemas/AgentType' }
              totalTokens: { type: integer }
              requestCount: { type: integer }
              creditsDiscounted: { type: number }
    SubscriptionSlot:
      type: object
      properties:
        id: { type: string }
        packageId: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        planId: { type: string }
        status: { type: string, enum: [active, queued, expired] }
        validFrom: { type: [string, 'null'], format: date-time }
        validUntil: { type: [string, 'null'], format: date-time }
        daysRemaining: { type: integer }
        paidAmountPaise: { type: integer }
        carriedDays: { type: number }
    Subscription:
      type: object
      properties:
        activeTier: { $ref: '#/components/schemas/Tier' }
        activePlanId: { type: string }
        status: { type: string, enum: [ACTIVE, FREE] }
        activeSlot:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionSlot'
            - type: 'null'
        reservedSlots:
          type: array
          description: Queued plans with projected dates.
          items: { $ref: '#/components/schemas/SubscriptionSlot' }
        updatedAt: { type: string, format: date-time }
    PaymentResult:
      type: object
      description: |
        `status: success` carries the new plan state. `already_processed` carries nothing else.
        `duplicate_payment` carries `duplicatePaymentId` and `originalPaymentId`.
      properties:
        status: { type: string, enum: [success, already_processed, duplicate_payment] }
        verified: { type: boolean, const: true }
        paymentStatus: { type: string, const: SUCCESS }
        transactionId: { type: string, format: uuid }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        invoiceNumber: { type: string }
        activeTier: { $ref: '#/components/schemas/Tier' }
        activePlanId: { type: [string, 'null'] }
        validUntil: { type: [string, 'null'], format: date-time }
        carriedDays: { type: number }
        reservedSlots:
          type: array
          items:
            type: object
            properties:
              tier: { $ref: '#/components/schemas/Tier' }
              remainingDays: { type: number }
        duplicatePaymentId: { type: string }
        originalPaymentId: { type: string }

    # --- ai -------------------------------------------------------------------
    ChatAgentType:
      type: string
      enum: [codingAgent, copilot]
    ProjectRef:
      type: object
      properties:
        projectId: { type: string, description: The project of the run. }
        sandboxId: { type: string, description: Used when projectId is missing. }
    OrionInvokeInput:
      type: object
      required: [projectId, sandboxId]
      properties:
        message: { type: string, description: The task. Required unless userPrompt is sent. }
        userPrompt: { type: string, description: Alias of message. }
        projectId: { type: string }
        sandboxId: { $ref: '#/components/schemas/SandboxId' }
        sessionId:
          $ref: '#/components/schemas/ObjectId'
          description: Continue this chat. Omit to start a new chat.
        autoApprovePlan: { type: boolean, default: false, description: Skip the plan review pause. }
        attachments:
          type: array
          maxItems: 5
          description: Files pasted into the prompt. Each content is cut to 12,000 characters.
          items:
            type: object
            properties:
              path: { type: string }
              content: { type: string }
    ClioInvokeInput:
      type: object
      required: [projectId, sandboxId]
      properties:
        message: { type: string }
        userPrompt: { type: string, description: Alias of message. }
        projectId: { type: string }
        sandboxId: { $ref: '#/components/schemas/SandboxId' }
        sessionId: { $ref: '#/components/schemas/ObjectId' }
        activeFile: { type: string, description: 'Path of the file open in the editor, or "none".' }
        activeFileContent: { type: string }
    OrionEvent:
      type: object
      description: |
        One SSE frame of an Orion stream: `id: <seq>`, `event: <name>`, `data: <json>`.
        Main payloads:
        - `agent:run` `{ runId, threadId, projectId, sessionId }`
        - `agent:session` `{ sessionId, title, isNew }`
        - `agent:msg_created` `{ role: user | assistant, id }`
        - `agent:model` `{ provider, modelId, label, fallback }`
        - `agent:status` `{ phase, node, title, detail, status }`
        - `agent:thinking` `{ node, text }`
        - `agent:steps` `{ steps: [{ id, title, status }] }`
        - `agent:step` `{ stepId, status, summary, filesWritten }`
        - `agent:message` `{ segment, text }` (append to the answer); `agent:message_retract` `{ segment }` (remove it)
        - `agent:tool_start` `{ id, node, toolName, input }`; `agent:tool_end` `{ id, node, toolName, ok, output }`
        - `agent:tool_log` (one line for the activity log)
        - `agent:plan_review` `{ plan, taskSubType, warnings, threadId }`
        - `agent:final` `{ text, outcome }`; `agent:done` `{ outcome, filesTouched, assistantMsgId }`
        - `agent:stopped` `{ message, text, assistantMsgId }`; `agent:error` `{ message, code, assistantMsgId? }`
        - `agent:snapshot` (re-attach only) `{ runId, projectId, sessionId, status, task, model,
          lastStatus, thinking, message, toolLogs, planReview, steps, startedAt }`
      properties:
        id: { type: integer }
        event: { type: string }
        data: { type: object, additionalProperties: true }
    ChatSession:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        projectId: { type: string }
        title: { type: string }
        lastMessageAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        status: { type: string, examples: [ok, error, stopped] }
        toolLogs: { type: array, items: {} }
        steps: { type: array, items: {} }
        outcome: { type: [string, 'null'] }
        file: { type: string, description: Clio only. The file that was open. }
        timestamp: { type: string, format: date-time }

    # --- sandbox --------------------------------------------------------------
    ProjectStatus:
      type: string
      enum: [not_started, building, live, down]
    Project:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        user: { type: string, description: Owner user id. }
        title: { type: string }
        sandboxId: { $ref: '#/components/schemas/SandboxId' }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        deletionStatus: { type: string, enum: [active, trash, deleted] }
        deletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    McpScope:
      type: string
      enum: [read, write, exec]
    McpTokenView:
      type: object
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        prefix: { type: string, description: 'First characters of the token, to recognise it.' }
        scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], description: 'Epoch ms as text, from Redis.' }
    McpTokenRecord:
      type: object
      description: What the gateway caches in Redis mcptoken:<hash>.
      properties:
        id: { type: string }
        userId: { type: string }
        projectId: { type: string }
        sandboxId: { $ref: '#/components/schemas/SandboxId' }
        scopes: { type: array, items: { $ref: '#/components/schemas/McpScope' } }
        expiresAt: { type: string, format: date-time }

    # --- json-rpc (MCP) -------------------------------------------------------
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id: { type: [integer, string] }
        method: { type: string, examples: [initialize, tools/list, tools/call] }
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      properties:
        jsonrpc: { type: string, const: '2.0' }
        id: { type: [integer, string, 'null'] }
        result:
          type: object
          additionalProperties: true
          properties:
            content:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, const: text }
                  text: { type: string, description: JSON of the tool result. }
            isError: { type: boolean }
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
    JsonRpcErrorBody:
      type: object
      required: [jsonrpc, error]
      properties:
        jsonrpc: { type: string, const: '2.0' }
        error:
          type: object
          properties:
            code: { type: integer, examples: [-32000, -32603] }
            message: { type: string }
        id: { type: 'null' }
