      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items: { $ref: '#/components/schemas/UsageEvent' }
                      total: { type: integer }
                      page: { type: integer }
                      totalPages: { type: integer }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/usage-events/analytics
  # ---------------------------------------------------------------------------
  # PURPOSE    Usage over a time range: daily timeline, per provider, per agent.
  # CALLED BY  payments_frontend usage charts (?days=7|30|90).
  # AUTH       Bearer.
  # HLD        Browser --GET .../usage-events/analytics?days=30--> payments-service
  #              --> 4 aggregate queries on usage_events (totals, per day, per provider, per agent)
  #            <-- 200 { data: { timeframeDays, totals, timeline[], byProvider[], byAgent[] } }
