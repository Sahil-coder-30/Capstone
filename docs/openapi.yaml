# =============================================================================
#  TAKSHA CODESPACE: OpenAPI 3.1 specification, with end to end notes
# =============================================================================
#
#  Checked against the code on 2026-11-14. Where this file and the code
#  disagree, the code wins: fix this file in the same commit as the code.
#
#  HOW TO READ THIS FILE
#  ---------------------
#  Every path has a comment block right above it with the same sections:
#
#    PURPOSE     what the API is for, in one or two lines
#    CALLED BY   which screen or service calls it
#    AUTH        what the caller must send
#    HLD         the request path through the system, drawn with arrows
#    STEPS       what the handler does, in order
#    FAILURES    every error the caller can get, and why
#    CODE        the files that implement it
#
#  The OpenAPI part (description, parameters, request body, responses) is
#  what tools like Swagger UI and Redoc render. The comments are for people
#  reading the YAML. Both say the same thing; the comments add the flow.
#
#  SYSTEM MAP (HLD)
#  ----------------
#
#   Browser: Frontend (5173), payments_frontend (5174, base /payments/)
#      |
#      |  http://localhost/api/...   (both frontends proxy /api to the ingress in dev)
#      v
#   +--------------------------- ingress-nginx (k8s/ingress.yml) ---------------------------+
#   |  /api/auth      -> auth-service:80          (container 3000)                          |
#   |  /api/payments  -> payments-service:80      (container 5051)                          |
#   |  /api/ai        -> ai-service:80            (container 3000, REST + SSE)              |
#   |  /api/sandbox   -> sandbox-service:80       (container 3000)                          |
#   |  /api/mcp       -> router-service:80        (MCP gateway for external agents)         |
#   |  host *.preview.localhost -> router-service -> sandbox pod port 80 -> Vite 5173       |
#   |  host *.agent.localhost   -> router-service -> sandbox pod port 3000 (sidecar)        |
#   +---------------------------------------------------------------------------------------+
#
#   Not routed by the ingress (cluster internal only):
#     /.well-known/jwks.json (Auth), /internal/* (Auth, Sandbox server),
#     /healthz, /readyz, /metrics, /api/router/*, sandbox-service-<id>:3000/mcp
#
#   Data stores:
#     Auth          -> Mongo db "auth" (users, refreshtokens, profiles, preferences), Redis (blacklist)
#     Payments      -> Postgres on Supabase (Drizzle), Redis (blacklist, cron lock), Razorpay
#     AI            -> Mongo db "ai" (chats, sessions, memories), Redis (rate limit), NVIDIA models
#     Sandbox server-> Mongo db "sandbox" (projects, mcptokens), Redis (sandbox:<id> TTL), K8s API
#     Router        -> Redis (refreshes sandbox:<id> TTL, mcptoken cache, MCP rate limit)
#     Notification  -> RabbitMQ only (auth_notification_queue, payment_notification_queue), SMTP
#
#  TOKENS (who signs, who accepts)
#  -------------------------------
#   Access token   RS256, signed by Auth, kid "auth-rsa-v1", iss "auth.takshacodespace.in",
#                  aud "takshacodespace-services", 15 min. Claims: sub, id, email, name, role.
#                  No "subscription" claim. Kept in browser memory only, sent as
#                  "Authorization: Bearer <jwt>".
#   Refresh token  opaque 128 hex chars, httpOnly cookie "refreshToken", path /api/auth
#                  (sent to /refresh and /logout), 30 days, SHA-256 stored in Mongo with a
#                  familyId. Rotated on every use. Cookies from before 2026-11-14 used path
#                  /api/auth/refresh; Auth clears that copy whenever it sets or clears the cookie.
#   Sandbox token  RS256, aud "taksha-sandbox", claim sbx=<sandboxId>, 2 h (AI runs) or
#                  10 to 15 min with a "scope" claim (external agents through the router).
#   MCP token      opaque "tks_mcp_...", made by the project owner, SHA-256 in Mongo,
#                  cached in Redis mcptoken:<hash>. Only the router accepts it.
#   Internal token shared secret INTERNAL_SERVICE_TOKEN in header X-Internal-Token,
#                  for /internal/* routes. Missing env var means 503 (fails closed).
#
#   Who verifies the access token, and how:
#     Auth           local public key certs/public.pem, checks the Redis blacklist
#     Payments       JWKS by kid (24 h cache), checks the blacklist, fails closed on writes
#                    when Redis is down (except /credit/update)
#     AI             JWKS by kid, checks the blacklist, HS256 JWT_ACCESS_SECRET fallback for tests
#     Sandbox server JWKS by kid, no blacklist check (accepted risk, see its middleware)
#     Sidecar        JWKS, and only the project owner (sub == OWNER_USER_ID) or a sandbox token
#
#  ERROR BODY FORMATS (they differ per service)
#  --------------------------------------------
#   Auth, Sandbox server, sidecar REST:  { "status": "error", "message": "..." }
#   Payments, AI (FaultKit):             { "success": false, "error": { "code", "message",
#                                          "details", "requestId" }, "requestId" }
#   Router MCP gateway, sidecar /mcp:    JSON-RPC { "jsonrpc": "2.0", "error": { "code": -32000,
#                                          "message" }, "id": null }
#   SSE streams (AI):                    HTTP 200 first, then an "error" or "agent:error" event
#
#  MESSAGE QUEUES (not HTTP, listed here so this file is complete)
#  ---------------------------------------------------------------
#   auth_notification_queue     Auth -> Notification. Body: { username, email, userId, action: "login",
#                               timestamps }. Sent on every Google login. Notification sends a login email.
#   payment_notification_queue  Payments -> Notification. Body: { action: "payment_success" |
#                               "payment_failed", email, username, invoiceNumber, transactionDetails,
#                               timestamps }. Notification sends a receipt or failure email.
#   Both are durable RabbitMQ queues (MQ_URL). Consumer nacks without requeue on error (no DLQ).
#   Planned move to Kafka: docs/plans/kafka-whatsapp-architecture.md.
#
# =============================================================================

openapi: 3.1.0

info:
  title: Taksha CodeSpace API
  version: 2.0.0
  summary: Every HTTP API of the Taksha microservices, checked against the code.
  description: |
    Taksha CodeSpace is a browser IDE with AI coding agents. Each user project runs in its
    own Kubernetes pod (a "sandbox"). This file documents every HTTP route of every service.

    | Service | Ingress prefix | Error format |
    |---|---|---|
    | Auth | `/api/auth` | `{ status: "error", message }` |
    | Payments | `/api/payments` | FaultKit `{ success: false, error: { code, message, details, requestId } }` |
    | AI orchestration | `/api/ai` | FaultKit, and SSE `error` events on streams |
    | Sandbox server | `/api/sandbox` | `{ status: "error", message }` |
    | Router (MCP gateway) | `/api/mcp` | JSON-RPC error |
    | Sandbox sidecar | host `<id>.agent.localhost` | `{ status: "error", message }`, JSON-RPC on `/mcp` |

    **Frontend rules that apply to every call**

    - Send the access token as `Authorization: Bearer <jwt>`. It lives in memory only
      (`Frontend/src/services/apiClient.js`).
    - On any 401, call `POST /api/auth/refresh` once (the browser sends the refresh cookie),
      then retry the request with the new token. If refresh fails, go to login.
    - `402` from the AI service means the credit window is used up. Show the refill time
      (`error.details.timeUntilRefillMs`) and the upgrade option.
    - `429` carries `Retry-After` (seconds). Wait, then retry.
    - SSE endpoints answer `200` and report problems as events, so always handle the
      `error` / `agent:error` event, not only the HTTP status.

    The comments above each path in the YAML source show the end to end flow of that API.
  contact:
    name: Taksha Platform Engineering
    url: https://github.com/Sahil-coder-30/Capstone

servers:
  - url: http://localhost
    description: Local Kubernetes ingress (Docker Desktop). All /api/* routes.
  - url: https://takshacodespace.in
    description: Production host (same paths).

tags:
  - name: Auth
    description: Google login, access and refresh tokens, logout, sandbox tokens.
  - name: Profile and preferences
    description: The user's developer profile and editor settings.
  - name: Payments checkout
    description: Razorpay order, browser verification and webhook.
  - name: Payments credits
    description: The 5-hour AI credit window and usage recording.
  - name: Payments dashboard
    description: Subscription, transactions and usage views for both frontends.
  - name: AI Orion
    description: Orion, the multi-step coding agent (LangGraph), streamed over SSE.
  - name: AI Clio
    description: Clio, the editor copilot, and project title generation.
  - name: AI chats
    description: Chat sessions and messages of Orion and Clio, with trash and restore.
  - name: Sandbox projects
    description: Projects, their Kubernetes sandbox pods and their trash.
  - name: Sandbox MCP tokens
    description: Tokens that let external agents (Claude Code, Cursor) use a project.
  - name: MCP gateway
    description: The public MCP endpoint for external agents, in the router.
  - name: Sandbox sidecar
    description: The agent container inside each sandbox pod (MCP tools, browser error reports).
  - name: Internal
    description: Service-to-service routes. Not routed by the ingress. Need X-Internal-Token.
  - name: Health
    description: Kubernetes probes and metrics. Mostly not routed by the ingress.

paths:

  # ===========================================================================
  #  AUTH SERVICE   (Auth/, port 3000, ingress /api/auth, Mongo "auth", Redis)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # GET /api/auth/google
  # ---------------------------------------------------------------------------
  # PURPOSE    Starts Google sign-in. The browser navigates here (full page, not fetch).
  # CALLED BY  Frontend login page (features/auth/components/Login), "Continue with Google".
  # AUTH       None.
  # HLD
  #   Browser --GET /api/auth/google--> Ingress --> auth-service (passport "google")
  #   auth-service --302 Location: accounts.google.com/o/oauth2/v2/auth?scope=profile email
  #                 &redirect_uri=<host>/api/auth/google/callback--> Browser
  #   Browser --> Google consent screen --> back to GET /api/auth/google/callback (next API)
  # STEPS
  #   1. passport.authenticate('google', { scope: ['profile','email'], session: false }).
  #   2. Answers 302 to Google. No database work, no cookie set here.
  # FAILURES
  #   Missing GOOGLE_CLIENT_ID / SECRET: Google shows its own error page.
  # CODE       Auth/src/routes/auth.routes.js, Auth/src/app/app.js (GoogleStrategy, proxy: true)
  /api/auth/google:
    get:
      tags: [Auth]
      operationId: authGoogleStart
      summary: Start Google sign-in (browser redirect)
      description: |
        Redirects the browser to Google's consent screen. Open it with
        `window.location.href`, never with `fetch`, because the answer is a redirect chain
        that ends on the Frontend.
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth 2.0 consent screen.
          headers:
            Location:
              description: Google authorization URL with `scope=profile email`.
              schema: { type: string, format: uri }

  # ---------------------------------------------------------------------------
  # GET /api/auth/google/callback
  # ---------------------------------------------------------------------------
  # PURPOSE    Google sends the user back here. Creates the user on first login, sends
  #            the login email, sets the refresh cookie and sends the user to the app.
  # CALLED BY  Google (browser redirect). Never called by app code.
  # AUTH       Google "code" query parameter, checked by passport.
  # HLD
  #   Google --302--> Browser --GET /api/auth/google/callback?code=...--> Ingress --> auth-service
  #     auth-service --exchange code--> Google (token + profile)
  #     auth-service --findOne({ googleId })--> Mongo users
  #         not found --> User.create({ googleId, name, email, photo })
  #     auth-service --await sendToQueue--> RabbitMQ auth_notification_queue --> Notification --> SMTP
  #     auth-service --issueTokenPair--> Mongo refreshtokens { tokenHash, familyId (new), expiresAt +30d }
  #     auth-service --302 Location: CLIENT_URL + Set-Cookie refreshToken (path /api/auth)--> Browser
  #   Browser loads the Frontend --> Frontend calls POST /api/auth/refresh to get its first access token
  # STEPS
  #   1. passport exchanges the code for the Google profile.
  #   2. Upsert by googleId (no update of name or photo for existing users).
  #   3. Publish { username, email, userId, action: 'login', timestamps } to RabbitMQ (awaited).
  #   4. Issue a token pair in a NEW family. Only the refresh token is used here; the access
  #      token is not returned, the Frontend gets one through /refresh.
  #   5. Clear any old-path cookie, then set cookie refreshToken (path /api/auth, httpOnly,
  #      sameSite lax, secure in production, 30 days).
  #   6. 302 to CLIENT_URL (default http://localhost:5173).
  # FAILURES
  #   Google auth fails: 302 to CLIENT_URL/?auth=failed (the app shows the login page again).
  #   Mongo error: JSON 500 { status: "error", message } from the Auth error handler.
  #   RabbitMQ down: sendAuthNotification returns false and login still works (no email).
  # KNOWN GAPS
  #   Login waits on the queue publish (await). Planned fix in the Kafka plan (stage K3).
  # CODE       Auth/src/controllers/auth.controller.js (authGoogleCallbackController),
  #            Auth/src/utils/generateTokens.js (issueTokenPair, setRefreshCookie), Auth/src/config/mq.js
  /api/auth/google/callback:
    get:
      tags: [Auth]
      operationId: authGoogleCallback
      summary: Google OAuth callback (sets the refresh cookie)
      description: |
        Handles the redirect from Google. Creates the user on first login, publishes a
        login email event, sets the `refreshToken` cookie and redirects to the Frontend
        (`CLIENT_URL`). The Frontend then calls `POST /api/auth/refresh` to get an access token.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Google.
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: |
            Signed in: redirect to `CLIENT_URL` with the refresh cookie set.
            Google sign-in failed: redirect to `CLIENT_URL/?auth=failed`, no cookie.
          headers:
            Location:
              description: '`CLIENT_URL` (default `http://localhost:5173`), or `CLIENT_URL/?auth=failed`.'
              schema: { type: string, format: uri }
            Set-Cookie:
              description: '`refreshToken=<128 hex>; Path=/api/auth; HttpOnly; SameSite=Lax; Max-Age=2592000` (`Secure` in production). Also clears a legacy cookie at `Path=/api/auth/refresh`.'
              schema: { type: string }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/auth/getMe
  # ---------------------------------------------------------------------------
  # PURPOSE    Returns the signed-in user's account (name, email, photo).
  # CALLED BY  Frontend useAuth on app load (fetchMeAPI), payments_frontend on load.
  # AUTH       Bearer access token (or cookie accessToken / token, legacy).
  # HLD
  #   Browser --GET /api/auth/getMe + Bearer--> Ingress --> auth-service
  #     identifyUser: Redis GET blacklist --> jwt.verify(RS256, certs/public.pem, iss, aud)
  #     auth-service --User.findById(sub)--> Mongo users
  #   auth-service --200 { user, accessToken }--> Browser
  # STEPS
  #   1. identifyUser (blacklist check, signature, issuer, audience).
  #   2. Load the user by id, without __v.
  #   3. Return it, and echo the token the caller sent as accessToken.
  # FAILURES
  #   401 no token, revoked token, bad or expired token.
  #   404 the token is valid but the user was deleted.
  # CODE       Auth/src/controllers/auth.controller.js (authGetMeController),
  #            Auth/src/middleware/auth.middleware.js
  /api/auth/getMe:
    get:
      tags: [Auth]
      operationId: authGetMe
      summary: Get the signed-in user
      description: Returns the user document of the token's `sub`. Use it on app load to show the account.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, user]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: User found successfully }
                  user: { $ref: '#/components/schemas/User' }
                  accessToken:
                    type: [string, 'null']
                    description: The token the caller sent, echoed back.
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '404':
          description: The token is valid but the user no longer exists. Log out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: User not found }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/auth/refresh
  # ---------------------------------------------------------------------------
  # PURPOSE    Swaps the refresh cookie for a new access token and a new refresh cookie
  #            (rotation). Detects reuse of an old refresh token and logs out everywhere.
  # CALLED BY  Frontend apiClient on app load and on any 401 (one retry);
  #            payments_frontend the same way.
  # AUTH       Cookie refreshToken only (path /api/auth). Call with credentials: 'include'.
  # HLD
  #   Browser --POST /api/auth/refresh (Cookie refreshToken)--> Ingress --> auth-service
  #     auth-service: hash = sha256(cookie)
  #     auth-service --findOne({ tokenHash: hash })--> Mongo refreshtokens
  #        missing or expired ...........> clear cookie, 401
  #        used == true (REUSE) .........> deleteMany({ familyId }) = all sessions of this
  #                                        login family revoked, clear cookie, 401
  #        valid ........................> set used = true
  #     auth-service --User.findById--> Mongo users
  #     auth-service --issueTokenPair(user, same familyId)--> Mongo refreshtokens (new row)
  #   auth-service --200 { accessToken } + Set-Cookie new refreshToken--> Browser
  # STEPS
  #   1. Read cookie refreshToken. None: 401.
  #   2. Find by SHA-256 hash. Missing or expired: clear cookie, 401.
  #   3. Already used: revoke the whole family, clear cookie, 401 (replay attack signal).
  #   4. Mark used, load the user (missing: 401).
  #   5. New access token (15 min) + new refresh token in the same family; set the cookie.
  # FAILURES   401 in every case above, body { status: "error", message }.
  # EDGE CASE  Two tabs refreshing at the same moment: the second one presents a used
  #            token and logs the family out. The Frontend serialises refresh calls.
  # CODE       Auth/src/controllers/auth.controller.js (authGenerateAccessToken),
  #            Auth/src/models/refreshToken.model.js
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate the refresh cookie and get a new access token
      description: |
        Exchanges the `refreshToken` cookie for a 15-minute access token and a new refresh
        cookie. A refresh token works once. Presenting an already used one revokes every
        refresh token of that login (reuse detection), so the user must sign in again.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token. A new `refreshToken` cookie is set.
          headers:
            Set-Cookie:
              description: New `refreshToken` cookie, same attributes as at login.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [status, message, accessToken]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Access token refreshed successfully }
                  accessToken: { type: string, description: 'RS256 JWT, 15 minutes.' }
        '401':
          description: |
            No cookie, unknown or expired token, reused token (family revoked), or the user no
            longer exists. Send the user to login.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              examples:
                missing: { value: { status: error, message: No refresh token provided } }
                expired: { value: { status: error, message: Invalid or expired refresh token } }
                reuse: { value: { status: error, message: 'Token reuse detected, all sessions revoked' } }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/auth/sandbox-token
  # ---------------------------------------------------------------------------
  # PURPOSE    Gives the AI service a 2-hour token for ONE sandbox, so an Orion run can call
  #            the sandbox sidecar longer than the 15-minute access token lives.
  # CALLED BY  AI service (Ai_orchestration/src/agent/tools/sandboxAuth.js) at run start and
  #            on plan approve or reject, with the user's own access token. Not the browser.
  # AUTH       Bearer access token of the user.
  # HLD
  #   ai-service --POST http://auth-service/api/auth/sandbox-token { sandboxId } + user Bearer-->
  #     auth-service identifyUser (blacklist + RS256)
  #     auth-service --INCR sandbox-token:rate:<user>:<minute> (30/min)--> Redis
  #     auth-service --sign { sub, id, sbx: sandboxId }, aud taksha-sandbox, exp 2h--> 200
  #   ai-service --POST sandbox-service-<id>:3000/mcp + Bearer <sandbox token>--> sidecar
  #     sidecar accepts only if sub == OWNER_USER_ID and sbx == SANDBOX_ID
  # STEPS
  #   1. Validate sandboxId as one DNS label (^[a-z0-9]([a-z0-9-]{0,46}[a-z0-9])?$).
  #   2. Rate limit 30 per user per minute (fails open if Redis is down).
  #   3. Sign the token. Ownership is NOT checked here: the sidecar rejects tokens for
  #      someone else's sandbox, so such a token is useless.
  # FAILURES   400 bad sandboxId, 401 bad token, 429 rate limit, 500 JSON on crash.
  # CODE       Auth/src/controllers/sandboxToken.controller.js, Auth/src/utils/generateTokens.js
  /api/auth/sandbox-token:
    post:
      tags: [Auth]
      operationId: authSandboxToken
      summary: Issue a 2-hour sandbox token for one AI run
      description: |
        Returns a JWT with audience `taksha-sandbox` and claim `sbx` = the sandbox id, valid for
        2 hours. Only the sandbox sidecar accepts it, and only when `sub` is the sandbox owner.
        Used by the AI service, not by the browser.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sandboxId]
              properties:
                sandboxId: { $ref: '#/components/schemas/SandboxId' }
      responses:
        '200':
          description: Sandbox token.
          content:
            application/json:
              schema:
                type: object
                required: [status, token, expiresIn]
                properties:
                  status: { type: string, const: success }
                  token: { type: string, description: 'RS256 JWT, aud taksha-sandbox, claims sub, id, sbx.' }
                  expiresIn: { type: integer, const: 7200, description: Seconds. }
        '400':
          description: sandboxId missing or not a DNS label.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: A valid sandboxId is required }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '429':
          description: More than 30 sandbox tokens in one minute for this user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: Too many sandbox token requests. Try again in a minute. }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/auth/logout
  # ---------------------------------------------------------------------------
  # PURPOSE    Ends the session: the access token stops working at once, the refresh
  #            family is revoked and the refresh cookie is cleared.
  # CALLED BY  Frontend logoutAPI (account menu), payments_frontend logout.
  # AUTH       Bearer access token.
  # HLD
  #   Browser --POST /api/auth/logout + Bearer--> Ingress --> auth-service
  #     identifyUser (blacklist + RS256)
  #     auth-service --SET blacklist:<token> EX <seconds until exp>--> Redis
  #        (Auth, Payments and AI check this key; Sandbox server does not)
  #     auth-service --findOne(sha256(cookie refreshToken)) then deleteMany({ familyId })--> Mongo
  #     auth-service --clearCookie refreshToken (path /api/auth/refresh)--> Browser
  #   Browser drops the in-memory access token and shows the login page
  # STEPS
  #   1. Blacklist the access token for the rest of its lifetime.
  #   2. If a refresh cookie came with the request, delete its whole family.
  #   3. Clear the cookie (current and legacy path). Answer 200.
  # FAILURES   401 bad token. Redis down: blacklistToken throws, JSON 500.
  # NOTE       Since 2026-11-14 the cookie path is /api/auth, so the browser sends it here
  #            and step 2 really revokes the family. Before, the path was /api/auth/refresh,
  #            the browser never sent it to logout, and a copied refresh token survived logout.
  # CODE       Auth/src/controllers/auth.controller.js (authLogoutController), Auth/src/config/redis.js
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Log out (blacklist the access token, clear the refresh cookie)
      description: |
        Blacklists the access token in Redis until it expires, deletes every refresh token of
        this login (the cookie's family) and clears the cookie. Send it with
        `credentials: 'include'` so the refresh cookie comes along.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Logged out successfully }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # GET | PUT /api/auth/profile
  # ---------------------------------------------------------------------------
  # PURPOSE    The user's public developer profile (bio, links, skills).
  # CALLED BY  Frontend settings page, profile tab (features/settings).
  # AUTH       Bearer access token.
  # HLD
  #   Browser --GET or PUT /api/auth/profile + Bearer--> Ingress --> auth-service
  #     identifyUser --> Profile.findOne({ userId }) / findOneAndUpdate(upsert)--> Mongo profiles
  #   auth-service --200 { profile }--> Browser
  # STEPS (GET)  find by userId; create a default profile if none exists; return it.
  # STEPS (PUT)  copy the body, drop userId, $set with validators, upsert; return the new doc.
  # FAILURES     401 bad token. Mongoose validation error (for example a string in
  #              experienceYears): 400 with the Mongoose message.
  # NOTE         PUT is a partial update: only fields in the body change. Unknown fields are
  #              dropped by the schema.
  # CODE         Auth/src/controllers/profile.controller.js, Auth/src/models/profile.model.js
  /api/auth/profile:
    get:
      tags: [Profile and preferences]
      operationId: getProfile
      summary: Get my profile (created with defaults on first call)
      description: Returns the profile of the signed-in user. The first call creates it with default values.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                type: object
                required: [status, profile]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Profile fetched successfully }
                  profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '500': { $ref: '#/components/responses/AuthServerError' }
    put:
      tags: [Profile and preferences]
      operationId: updateProfile
      summary: Update my profile (partial)
      description: Sets only the fields sent. `userId` in the body is ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [status, profile]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Profile updated successfully }
                  profile: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # GET | PUT /api/auth/preferences
  # ---------------------------------------------------------------------------
  # PURPOSE    Editor and app settings: theme, font size, minimap, copilot style, email alerts.
  # CALLED BY  Frontend settings page and the editor on load.
  # AUTH       Bearer access token.
  # HLD
  #   Browser --GET or PUT /api/auth/preferences + Bearer--> Ingress --> auth-service
  #     identifyUser --> Preferences.findOne / findOneAndUpdate(dot-path $set, upsert)--> Mongo preferences
  #   auth-service --200 { preferences }--> Browser
  # STEPS (GET)  find by userId; create defaults if none; return.
  # STEPS (PUT)  only known fields are copied, as dot paths (editor.fontSize, copilot.autoSuggest,
  #              ...), so sending one nested field never wipes its siblings.
  # FAILURES     401 bad token. theme not in dark|light|system or interactiveMode not in
  #              concise|detailed: 400 with the Mongoose message.
  # NOTE         copilot.modelPreference is stored but not used by the AI service today
  #              (the AI service picks NVIDIA models from its own env).
  # CODE         Auth/src/controllers/preferences.controller.js, Auth/src/models/preferences.model.js
  /api/auth/preferences:
    get:
      tags: [Profile and preferences]
      operationId: getPreferences
      summary: Get my preferences (created with defaults on first call)
      description: Returns theme, editor, copilot and notification settings of the signed-in user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema:
                type: object
                required: [status, preferences]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Preferences fetched successfully }
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '500': { $ref: '#/components/responses/AuthServerError' }
    put:
      tags: [Profile and preferences]
      operationId: updatePreferences
      summary: Update my preferences (deep partial merge)
      description: |
        Merges the sent fields into the stored preferences. Nested objects are merged field
        by field, so `{ "editor": { "fontSize": "16px" } }` changes only the font size.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferencesInput' }
      responses:
        '200':
          description: The updated preferences.
          content:
            application/json:
              schema:
                type: object
                required: [status, preferences]
                properties:
                  status: { type: string, const: success }
                  message: { type: string, example: Preferences updated successfully }
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/AuthBadRequest' }
        '401': { $ref: '#/components/responses/AuthUnauthorized' }
        '500': { $ref: '#/components/responses/AuthServerError' }

  # ---------------------------------------------------------------------------
  # GET /.well-known/jwks.json
  # ---------------------------------------------------------------------------
  # PURPOSE    Publishes Auth's RSA public key so every other service can verify access
  #            tokens locally, without calling Auth on each request.
  # CALLED BY  Payments, AI, Sandbox server and every sandbox sidecar (AUTH_JWKS_URI =
  #            http://auth-service/.well-known/jwks.json). Not routed by the ingress.
  # AUTH       None.
  # HLD
  #   payments / ai / sandbox / sidecar --GET http://auth-service/.well-known/jwks.json--> auth-service
  #     auth-service: key built once at startup from RSA_PUBLIC_KEY, RSA_PRIVATE_KEY or certs/public.pem
  #   <-- 200 { keys: [ { kty RSA, use sig, alg RS256, kid auth-rsa-v1, n, e } ] }, Cache-Control 24h
  #   Callers cache the key list 24 h and refetch once when a token shows an unknown kid
  #   (key rotation). If Auth is down they keep using the cached list.
  # FAILURES   None at request time. A missing key stops Auth at startup.
  # CODE       Auth/src/routes/jwks.route.js
  /.well-known/jwks.json:
    servers:
      - url: http://auth-service
        description: In-cluster only. Not routed by the ingress.
    get:
      tags: [Auth, Internal]
      operationId: authJwks
      summary: JSON Web Key Set (public key for RS256 tokens)
      description: |
        RFC 7517 key set with one RSA key, `kid: auth-rsa-v1`. Cached by callers for 24 hours.
        Look the key up by the `kid` header of the token.
      security: []
      responses:
        '200':
          description: The key set.
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=86400' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }

  # ---------------------------------------------------------------------------
  # POST /internal/sandbox-token   (Auth)
  # ---------------------------------------------------------------------------
  # PURPOSE    Gives the router a short, SCOPED sandbox token for an external agent call.
  #            The external agent never sees it.
  # CALLED BY  Router MCP gateway (Sandbox/router/src/mcpGateway.js sandboxTokenFor), after it
  #            has checked the user's tks_mcp_ token. Cached by the router until 60 s before expiry.
  # AUTH       X-Internal-Token = INTERNAL_SERVICE_TOKEN (constant-time compare).
  # HLD
  #   router --POST http://auth-service/internal/sandbox-token
  #           { userId, sandboxId, scopes: [read, write?, exec?], ttlSeconds: 600 }
  #           X-Internal-Token--> auth-service
  #     requireInternalCaller: env unset -> 503, mismatch -> 401
  #     auth-service --User.exists(userId)--> Mongo users
  #     auth-service --sign { sub, id, sbx, scope: "read write" }, aud taksha-sandbox, exp ttl--> router
  #   router --proxy to sandbox-service-<id>:3000/mcp with that token--> sidecar
  #     sidecar: scoped token may only use /mcp, and only tools whose scope is in "scope"
  # FAILURES   400 bad userId (not an ObjectId), bad sandboxId, empty or unknown scopes,
  #            ttl outside 60..900; 401 bad internal token; 404 user not found;
  #            503 INTERNAL_SERVICE_TOKEN not set.
  # CODE       Auth/src/controllers/internalSandboxToken.controller.js,
  #            Auth/src/middleware/internalAuth.middleware.js
  /internal/sandbox-token:
    servers:
      - url: http://auth-service
        description: In-cluster only.
    post:
      tags: [Internal, Auth]
      operationId: internalSandboxToken
      summary: Scoped short sandbox token for the MCP gateway
      description: |
        Signs a sandbox token for `userId` and `sandboxId` with a `scope` claim. The sidecar then
        allows only `/mcp` and only the tools in those scopes. Default lifetime 10 minutes,
        at most 15.
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, sandboxId, scopes]
              properties:
                userId: { type: string, pattern: '^[a-f0-9]{24}$', description: Mongo ObjectId of the user. }
                sandboxId: { $ref: '#/components/schemas/SandboxId' }
                scopes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/McpScope' }
                ttlSeconds: { type: integer, minimum: 60, maximum: 900, default: 600 }
      responses:
        '200':
          description: Scoped sandbox token.
          content:
            application/json:
              schema:
                type: object
                required: [status, token, expiresIn]
                properties:
                  status: { type: string, const: success }
                  token: { type: string, description: 'RS256 JWT, aud taksha-sandbox, claims sub, id, sbx, scope.' }
                  expiresIn: { type: integer, description: Seconds. }
        '400':
          description: Invalid userId, sandboxId, scopes or ttlSeconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
        '401': { $ref: '#/components/responses/InternalUnauthorized' }
        '404':
          description: No user with this id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: User not found }
        '503': { $ref: '#/components/responses/InternalNotConfigured' }

  # ---------------------------------------------------------------------------
  # GET /metrics   (Auth only)
  # ---------------------------------------------------------------------------
  # PURPOSE    Prometheus metrics of Auth (request count and duration per route template).
  # CALLED BY  Nobody yet: no Prometheus is deployed (planned, Kafka plan stage K7 / admin P5).
  # AUTH       None. Safe because no ingress prefix reaches it.
  # HLD        prometheus --GET http://auth-service/metrics--> auth-service --> prom-client registry
  # CODE       Auth/src/observability/metrics.js, Auth/src/middleware/metrics.middleware.js
  /metrics:
    servers:
      - url: http://auth-service
        description: In-cluster only.
    get:
      tags: [Health]
      operationId: authMetrics
      summary: Prometheus metrics (Auth)
      description: '`prom-client` text format. Labels use the route template, never the raw URL.'
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  # ---------------------------------------------------------------------------
  # GET /healthz and GET /readyz   (Auth, Payments, Notification)
  # ---------------------------------------------------------------------------
  # PURPOSE    Kubernetes liveness and readiness probes. Same paths on three services.
  # CALLED BY  kubelet (k8s/*deployment.yml probes).
  # HLD        kubelet --GET http://<pod-ip>:<port>/healthz--> service --> 200
  #            Payments /readyz also runs a SELECT on Postgres (503 when the database is down).
  #            Auth and Notification answer 200 without checking anything.
  # CODE       Auth/src/app/app.js, Payments/app/app.js, Notification/src/app/app.js
  /healthz:
    servers:
      - url: http://auth-service
      - url: http://payments-service
      - url: http://notification-service
    get:
      tags: [Health]
      operationId: healthz
      summary: Liveness probe (Auth, Payments, Notification)
      description: Answers 200 while the process runs. Body differs per service.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                auth: { value: { message: Server is healthy } }
                payments: { value: { status: ok, service: payments } }
                notification: { value: { message: Notification service is healthy.... } }
  /readyz:
    servers:
      - url: http://auth-service
      - url: http://payments-service
      - url: http://notification-service
    get:
      tags: [Health]
      operationId: readyz
      summary: Readiness probe (Auth, Payments, Notification)
      description: Payments checks its Postgres connection. Auth and Notification always answer 200.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                auth: { value: { message: Server is ready to use } }
                payments: { value: { status: ok, service: payments, db: up } }
                notification: { value: { message: Notification service is ready.... } }
        '503':
          description: Payments only, Postgres unreachable.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: { status: error, service: payments, db: down }

  # ===========================================================================
  #  PAYMENTS SERVICE   (Payments/, container 5051, ingress /api/payments)
  #  Postgres on Supabase through Drizzle (money in paise), Redis, Razorpay.
  #  Every protected route runs identifyUser first:
  #    Bearer only (no cookie) --> Redis blacklist --> JWKS by kid --> RS256 verify
  #    --> ensureAccount(userId) creates the accounts row on first call (tier free)
  #  Redis down: GET routes stay open; POST routes answer 503, except /credit/update.
  #  Errors: FaultKit { success: false, error: { code, message, details, requestId } }.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit/packages
  # ---------------------------------------------------------------------------
  # PURPOSE    The plans Taksha sells (Free, Pro Rs 499, Max Rs 999) for pricing pages.
  # CALLED BY  Frontend pricing and settings (fetchPackagesAPI), payments_frontend plan list.
  # AUTH       None (public).
  # HLD
  #   Browser --GET /api/payments/credit/packages--> Ingress --> payments-service
  #     getPublicPackages() reads config/plans.config.js (no database)
  #   <-- 200 { packages: [ free, pro_regular, max_regular ] }
  # NOTE       pricePaise and planIdEnvKey are not exposed. Checkout uses the package id.
  # CODE       Payments/controllers/credit.controller.js (getPackages), Payments/config/plans.config.js
  /api/payments/credit/packages:
    get:
      tags: [Payments credits]
      operationId: listPackages
      summary: List the plans for sale (public)
      description: Static list from `config/plans.config.js`. Use `id` as `packageId` in checkout.
      security: []
      responses:
        '200':
          description: The packages.
          content:
            application/json:
              schema:
                type: object
                required: [status, packages]
                properties:
                  status: { type: string, const: success }
                  packages:
                    type: array
                    items: { $ref: '#/components/schemas/Package' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit
  # ---------------------------------------------------------------------------
  # PURPOSE    Full credit view: the 5-hour window, lifetime token usage per provider,
  #            the current billing period and the tier limits.
  # CALLED BY  Frontend settings (credits tab) and header credit badge, payments_frontend.
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/credit + Bearer--> Ingress --> payments-service identifyUser
  #     checkCredit(userId):
  #       promoteIfExpired --> Postgres subscription_slots (ended plan -> next queued slot or free)
  #       refreshWindow    --> Postgres accounts (refill the window when windowRefillAt has passed)
  #     getUsageTotals    --> Postgres usage_events (sum per provider)
  #     getSubscriptionState --> Postgres subscription_slots (active + queued)
  #   <-- 200 { credit: { subscription, credits, canQuery, window..., providerCredits[], tierConfig } }
  # STEPS      Lazy expiry and lazy refill happen on this read, so the numbers are always current.
  # FAILURES   401 token, 503 JWKS unreachable, 500 database.
  # CODE       Payments/controllers/credit.controller.js (getCredit, buildCreditView),
  #            Payments/services/credit.service.js, Payments/serializers/api.serializers.js (serializeCredit)
  /api/payments/credit:
    get:
      tags: [Payments credits]
      operationId: getCredit
      summary: My credit window, usage totals and tier limits
      description: |
        One credit window per user, refilled every 5 hours (Free 20, Pro 150, Max 200 credits).
        1 credit = `tokensPerCredit` tokens (default 1000). When the balance drops below
        `tierConfig.creditLowerLimit` the window locks until `windowRefillAt`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The credit view.
          content:
            application/json:
              schema:
                type: object
                required: [status, credit]
                properties:
                  status: { type: string, const: success }
                  credit: { $ref: '#/components/schemas/CreditView' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit/check
  # ---------------------------------------------------------------------------
  # PURPOSE    "Can this user send an AI request right now?" Small and fast.
  # CALLED BY  AI service creditLedger middleware before every Orion, Clio and title call,
  #            with the user's own token.
  # AUTH       Bearer.
  # HLD
  #   ai-service creditLedger --GET http://payments-service/api/payments/credit/check + user Bearer-->
  #     payments-service identifyUser --> checkCredit (lazy plan expiry, lazy window refill)
  #   <-- 200 { canQuery, creditsRemaining, nextRefillAt, timeUntilRefillMs, subscription }
  #   ai-service: canQuery false --> 402 INSUFFICIENT_CREDITS to the browser
  #               Payments down or timeout (5 s) --> fail OPEN, the AI call goes ahead
  # NOTE       This route never answers 402 itself; canQuery: false is a 200.
  # CODE       Payments/controllers/credit.controller.js (getCreditCheck),
  #            Ai_orchestration/src/middleware/creditLedger.middleware.js
  /api/payments/credit/check:
    get:
      tags: [Payments credits]
      operationId: checkCredit
      summary: Can I send an AI request now?
      description: |
        Returns the window state. `canQuery` is false when `creditsRemaining` is below the
        tier's `creditLowerLimit`. `hasCredit` is the same value, kept for older clients.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Window state.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [status]
                    properties:
                      status: { type: string, const: success }
                  - $ref: '#/components/schemas/CreditCheck'
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # POST /api/payments/credit/update
  # ---------------------------------------------------------------------------
  # PURPOSE    Records one AI request's token usage and takes its credits from the window,
  #            in one transaction. Safe to send twice (idempotent on requestId).
  # CALLED BY  AI service recordAiUsage after each Orion run, each Clio turn, each title and
  #            each memory-agent call (agentType memory costs 0 credits).
  # AUTH       Bearer of the user whose usage it is. A body userId that differs: 403.
  # HLD
  #   ai-service --POST /api/payments/credit/update { requestId, modelId, agentType, projectId,
  #               chatId, promptTokens, completionTokens, totalTokens, company }--> payments-service
  #     identifyUser (fails OPEN on Redis outage for this route only, so billing is never lost)
  #     validate token counts (non-negative, int32, total >= prompt + completion)
  #     recordUsage:
  #       promoteIfExpired --> subscription_slots
  #       BEGIN
  #         refreshWindow (lock accounts row)
  #         INSERT usage_events ... ON CONFLICT (user_id, request_id) DO NOTHING
  #            conflict --> duplicate: true, nothing deducted, COMMIT
  #         UPDATE accounts SET windowCreditsRemaining = max(0, old - credits),
  #            and when it crosses the lower limit: windowExhaustedAt = now(),
  #            windowRefillAt = now() + windowHours
  #       COMMIT
  #   <-- 200 { credit: <window after>, usage: { creditsDeducted, creditsDiscounted, duplicate } }
  # FAILURES   400 bad numbers, 401 token, 403 other user's id, 500 database.
  # KNOWN GAPS The AI service ignores failures here (P7 in the Kafka plan): usage is lost
  #            when Payments is down at the end of a run.
  # CODE       Payments/controllers/credit.controller.js (postCreditUpdate),
  #            Payments/services/credit.service.js (recordUsage), Ai_orchestration/src/services/credit.service.js
  /api/payments/credit/update:
    post:
      tags: [Payments credits]
      operationId: recordCreditUsage
      summary: Record AI token usage and deduct credits (idempotent)
      description: |
        Stores one `usage_events` row and deducts `totalTokens / tokensPerCredit` credits.
        The pair (user, `requestId`) is unique: a repeat returns `duplicate: true` and deducts
        nothing. `agentType: memory` is recorded with real tokens but deducts 0 credits
        (shown as `creditsDiscounted`). Unknown providers are stored as `unknown`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageInput' }
      responses:
        '200':
          description: Recorded, or already recorded for this requestId.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, credit, usage]
                properties:
                  status: { type: string, const: success }
                  message:
                    type: string
                    enum: [Usage recorded, Usage already recorded for this requestId]
                  credit: { $ref: '#/components/schemas/CreditCheck' }
                  usage:
                    type: object
                    properties:
                      company: { type: string, enum: [nvidia, unknown] }
                      subscription: { $ref: '#/components/schemas/Tier' }
                      creditsDeducted: { type: number }
                      creditsDiscounted: { type: number }
                      totalTokens: { type: integer }
                      duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit/transactions
  # ---------------------------------------------------------------------------
  # PURPOSE    Paged billing history (purchases, refunds, failures) for the Frontend settings page.
  # CALLED BY  Frontend settings billing tab (fetchTransactionsAPI ?page=).
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/credit/transactions?page&limit&type + Bearer--> payments-service
  #     listTransactions --> Postgres transactions LEFT JOIN invoices (newest first) + count
  #   <-- 200 { pagination: { page, limit, total, pages }, transactions[] }
  # NOTE       Same data as GET /api/payments/transactions, older response shape (kept for
  #            the Frontend). payments_frontend uses the other one.
  # CODE       Payments/controllers/credit.controller.js (getCreditTransactions), Payments/services/billing.service.js
  /api/payments/credit/transactions:
    get:
      tags: [Payments dashboard]
      operationId: listCreditTransactions
      summary: My billing transactions (paged, Frontend shape)
      description: Newest first. `limit` is clamped to 1..100.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema:
                type: object
                required: [status, pagination, transactions]
                properties:
                  status: { type: string, const: success }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      pages: { type: integer }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit/transactions/summary
  # ---------------------------------------------------------------------------
  # PURPOSE    Summary card: money spent, purchases, tokens used, current plan period.
  # CALLED BY  Frontend settings billing tab, payments_frontend overview.
  # AUTH       Bearer.
  # HLD
  #   Browser --GET .../credit/transactions/summary + Bearer--> payments-service
  #     in parallel: getSpendSummary (payments captured + usage_events sums),
  #                  getSubscriptionState (slots), checkCredit (window)
  #   <-- 200 { summary }
  # CODE       Payments/controllers/credit.controller.js (getCreditTransactionSummary)
  /api/payments/credit/transactions/summary:
    get:
      tags: [Payments dashboard]
      operationId: getTransactionSummary
      summary: My spend and usage summary
      description: '`totalBillableINR` is always 0 (credits are not billed per use).'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                required: [status, summary]
                properties:
                  status: { type: string, const: success }
                  summary:
                    type: object
                    additionalProperties: true
                    properties:
                      totalBillableINR: { type: number, const: 0 }
                      currentSubscription: { $ref: '#/components/schemas/Tier' }
                      currentPeriodStart: { type: [string, 'null'], format: date-time }
                      currentPeriodEnd: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/credit/analytics
  # ---------------------------------------------------------------------------
  # PURPOSE    Usage charts for the Frontend: totals, per provider, per agent, last 30 events.
  # CALLED BY  Frontend settings usage tab (fetchAnalyticsAPI).
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/credit/analytics + Bearer--> payments-service
  #     getUsageTotals + recentUsageEvents(30) + checkCredit --> Postgres
  #     byAgent is computed from the 30 recent events only
  #   <-- 200 { analytics: { totals, byProvider[], byAgent{}, recentEvents[] } }
  # CODE       Payments/controllers/credit.controller.js (getCreditAnalytics)
  /api/payments/credit/analytics:
    get:
      tags: [Payments dashboard]
      operationId: getCreditAnalytics
      summary: My usage analytics (Frontend shape)
      description: '`byAgent` covers only the last 30 events. For a time range use `GET /api/payments/usage-events/analytics`.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics.
          content:
            application/json:
              schema:
                type: object
                required: [status, analytics]
                properties:
                  status: { type: string, const: success }
                  analytics:
                    type: object
                    properties:
                      totals:
                        type: object
                        properties:
                          promptTokens: { type: integer }
                          completionTokens: { type: integer }
                          totalTokens: { type: integer }
                      byProvider:
                        type: array
                        items: { type: object, additionalProperties: true }
                      byAgent:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            totalTokens: { type: integer }
                            requestCount: { type: integer }
                      recentEvents:
                        type: array
                        items: { $ref: '#/components/schemas/UsageEvent' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # POST /api/payments/create/order
  # ---------------------------------------------------------------------------
  # PURPOSE    Step 1 of checkout: creates a Razorpay order for a package and saves it.
  # CALLED BY  payments_frontend plan page ("Buy Pro" / "Buy Max").
  # AUTH       Bearer. Fails closed (503) when Redis is down, because it is a money write.
  # HLD (whole checkout, this API is step 1)
  #
  #   payments_frontend         payments-service               Razorpay          Postgres
  #     | 1 POST /create/order    |                               |                  |
  #     |   { packageId }         |                               |                  |
  #     |------------------------>| getPackageById                |                  |
  #     |                         |--- orders.create(amount) ---->|                  |
  #     |                         |<-- { id: order_xxx } ---------|  (10 s timeout)  |
  #     |                         |--- INSERT orders (created, email, amount) ------>|
  #     |<-- 201 { orderId, amount, keyId } ----------------------|                  |
  #     | 2 open Razorpay Checkout modal with keyId + orderId     |                  |
  #     |-------------------------------------------------------->| user pays        |
  #     |<-- { razorpay_payment_id, razorpay_order_id, signature }|                  |
  #     | 3 POST /verify (next API)                               |                  |
  #     |                                                         | 4 webhook        |
  #     |                         |<-- POST /webhook payment.captured (in parallel) -|
  #   Steps 3 and 4 both settle the same payment; the payments primary key makes it apply once.
  #
  # STEPS      1. Find the package (id like pro_regular, or a bare tier like pro). Unknown: 400.
  #            Free: 400. 2. Razorpay order with notes { userId, packageId }. 3. Save the order
  #            with the email and name from the token (receipts go to this email).
  # FAILURES   400 unknown or free package, 401, 503 Redis down or Razorpay timeout / 5xx.
  # CODE       Payments/controllers/payment.controller.js (createOrder),
  #            Payments/services/checkout.service.js (startCheckout), Payments/services/razorpay.service.js
  /api/payments/create/order:
    post:
      tags: [Payments checkout]
      operationId: createOrder
      summary: Create a Razorpay order for a plan
      description: |
        Returns what the Razorpay Checkout modal needs (`orderId`, `amount` in paise, `keyId`).
        After payment, call `POST /api/payments/verify` with what the modal returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId:
                  type: string
                  description: Package id (`pro_regular`, `max_regular`) or a bare tier (`pro`, `max`).
                  examples: [pro_regular]
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    required: [orderId, amount, currency, keyId, package]
                    properties:
                      orderId: { type: string, examples: [order_PnX1s0aB2c3d4e] }
                      amount: { type: integer, description: Paise., examples: [49900] }
                      currency: { type: string, const: INR }
                      keyId: { type: string, description: Razorpay public key id for the modal. }
                      package:
                        type: object
                        properties:
                          id: { type: string }
                          label: { type: string }
                          tier: { $ref: '#/components/schemas/Tier' }
                          priceINR: { type: number }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # POST /api/payments/verify
  # ---------------------------------------------------------------------------
  # PURPOSE    Step 3 of checkout: the browser hands over what Razorpay returned. The server
  #            checks it with Razorpay itself, then applies the plan.
  # CALLED BY  payments_frontend, in the Razorpay modal's success handler.
  # AUTH       Bearer. Fails closed (503) when Redis is down.
  # HLD
  #   payments_frontend --POST /verify { orderId, paymentId, signature }--> payments-service
  #     getOrder(orderId) --> Postgres orders            missing -> 404, other user's -> 403
  #     HMAC-SHA256(orderId|paymentId, key secret) == signature (constant time)  else 400
  #     Razorpay payments.fetch(paymentId) (10 s)        404 -> 404, other errors -> 503
  #     payment.order_id must equal orderId              else 400
  #     status authorized --> Razorpay capture           failure -> 503 (webhook settles later)
  #     status not captured --> 400
  #     processSubscriptionPayment, ONE transaction:
  #       lock accounts row
  #       payment already stored for this order? same id -> already_processed,
  #                                              other id -> PAYMENT_DUPLICATE (marked for refund)
  #       INSERT payments (primary key = Razorpay payment id, so it applies once)
  #       promote expired slots, apply the new slot (upgrade now or queue behind the active one)
  #       INSERT invoices, INSERT transactions, UPDATE orders SET status paid, setTier
  #     COMMIT
  #     on success: RabbitMQ payment_notification_queue --> Notification --> receipt email
  #   <-- 200 { message, data: { status, activeTier, validUntil, invoiceNumber, ... } }
  # FAILURES   400 bad input, bad signature, wrong order, not captured, currency or amount
  #            mismatch; 401; 403 other user's order; 404 order or payment unknown; 503.
  # CODE       Payments/controllers/payment.controller.js (verifyPayment),
  #            Payments/services/checkout.service.js (verifyCheckout), Payments/services/billing.service.js
  /api/payments/verify:
    post:
      tags: [Payments checkout]
      operationId: verifyPayment
      summary: Verify a Razorpay payment and apply the plan
      description: |
        Checks the signature, re-fetches the payment from Razorpay (never trusts the browser),
        captures it if only authorized, and applies the plan in one database transaction.
        Calling it twice, or racing with the webhook, is safe: `data.status` is then
        `already_processed`. A second, different payment for an already paid order returns
        `duplicate_payment` and is logged for a refund.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, paymentId, signature]
              properties:
                orderId: { type: string, maxLength: 200, description: razorpay_order_id }
                paymentId: { type: string, maxLength: 200, description: razorpay_payment_id }
                signature: { type: string, maxLength: 200, description: razorpay_signature }
      responses:
        '200':
          description: Payment applied (or already applied).
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status: { type: string, const: success }
                  message:
                    type: string
                    enum:
                      - Payment verified and subscription updated
                      - Payment was already applied
                      - This order was already paid. The extra payment is logged for a refund.
                  data: { $ref: '#/components/schemas/PaymentResult' }
        '400': { $ref: '#/components/responses/FaultBadRequest' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '404': { $ref: '#/components/responses/FaultNotFound' }
        '500': { $ref: '#/components/responses/FaultServerError' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  # ---------------------------------------------------------------------------
  # POST /api/payments/webhook
  # ---------------------------------------------------------------------------
  # PURPOSE    Razorpay tells Payments about captured, failed and refunded payments, also when
  #            the browser closed before /verify.
  # CALLED BY  Razorpay servers.
  # AUTH       X-Razorpay-Signature = HMAC-SHA256 of the exact raw body (req.rawBody, kept by
  #            express.json verify hook), constant-time compare. No JWT.
  # HLD
  #   Razorpay --POST /api/payments/webhook (raw JSON + X-Razorpay-Signature)--> Ingress --> payments-service
  #     signature wrong ......................> 400 (Razorpay retries, then gives up)
  #     event not handled ....................> 200 { status: ignored }
  #     payment.captured | order.paid ........> settle (same transaction as /verify) + receipt email
  #     payment.failed .......................> recordPaymentFailure (FAILED transaction once,
  #                                             not after the order is paid) + failure email
  #     refund.processed .....................> processRefund: once per refund id; a full refund
  #                                             marks the payment refunded and removes the 30 days
  #                                             it bought, then promotes slots
  #     unknown order ........................> logged loudly, 200 (a retry could never apply)
  #     processing error .....................> 5xx, so Razorpay retries; payment id key makes it safe
  #   <-- 200 { status: received }
  # CODE       Payments/controllers/webhook.controller.js, Payments/services/checkout.service.js
  #            (handleWebhookEvent), Payments/services/billing.service.js (processRefund)
  /api/payments/webhook:
    post:
      tags: [Payments checkout]
      operationId: razorpayWebhook
      summary: Razorpay webhook (server to server)
      description: |
        Handles `payment.captured`, `order.paid`, `payment.failed` and `refund.processed`.
        Every handler is idempotent. Other events are acknowledged with `ignored`.
        Do not put another body parser before this route: the HMAC needs the exact bytes.
      security:
        - razorpaySignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event:
                  type: string
                  examples: [payment.captured]
                payload:
                  type: object
                  description: 'Razorpay payload, for example `{ payment: { entity } }` or `{ refund: { entity } }`.'
                  additionalProperties: true
      responses:
        '200':
          description: Handled or ignored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [received, ignored] }
        '400':
          description: Signature check failed or raw body missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaultError' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/subscription
  # ---------------------------------------------------------------------------
  # PURPOSE    The active plan and the plans queued after it, with dates.
  # CALLED BY  payments_frontend subscription page, Frontend settings.
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/subscription + Bearer--> payments-service
  #     getSubscriptionState --> Postgres subscription_slots (active + queued, expiry promoted lazily)
  #     queued slots get projected start / end dates: they start when the one before ends
  #   <-- 200 { data: { activeTier, status ACTIVE | FREE, activeSlot, reservedSlots[] } }
  # NOTE       There is no PATCH on this path. Plans change only through checkout.
  # CODE       Payments/controllers/subscription.controller.js (getSubscription),
  #            Payments/serializers/api.serializers.js (serializeSubscription)
  /api/payments/subscription:
    get:
      tags: [Payments dashboard]
      operationId: getSubscription
      summary: My active and queued plans
      description: |
        A user has at most one active slot and any number of queued slots. A queued slot keeps
        its remaining time (`daysRemaining`) and starts when the active one ends.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription state.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/transactions
  # ---------------------------------------------------------------------------
  # PURPOSE    Filterable transaction list with totals, for payments_frontend.
  # CALLED BY  payments_frontend transactions page.
  # AUTH       Bearer.
  # HLD
  #   Browser --GET /api/payments/transactions?page&limit&type&status&startDate&endDate--> payments-service
  #     listTransactions --> Postgres transactions LEFT JOIN invoices, filtered, plus one
  #                          aggregate query (count, success count, money spent)
  #   <-- 200 { data: { transactions[], total, page, totalPages, summary } }
  # CODE       Payments/controllers/subscription.controller.js (getTransactions)
  /api/payments/transactions:
    get:
      tags: [Payments dashboard]
      operationId: listTransactions
      summary: My transactions (filtered, payments_frontend shape)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SUCCESS, FAILED, REFUNDED] }
        - name: startDate
          in: query
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One page and totals.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
                      total: { type: integer }
                      page: { type: integer }
                      totalPages: { type: integer }
                      summary:
                        type: object
                        properties:
                          totalSpentINR: { type: number }
                          totalTransactions: { type: integer }
                          successCount: { type: integer }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/transactions/{id}
  # ---------------------------------------------------------------------------
  # PURPOSE    One transaction with its invoice number (receipt view).
  # CALLED BY  payments_frontend transaction detail.
  # AUTH       Bearer. Only the caller's own transactions are found.
  # HLD        Browser --GET /api/payments/transactions/<uuid>--> payments-service
  #              --> SELECT ... WHERE user_id = me AND id = <uuid>  (not a UUID: treated as missing)
  #            <-- 200 { data } or 404
  # CODE       Payments/controllers/subscription.controller.js (getTransactionById)
  /api/payments/transactions/{id}:
    get:
      tags: [Payments dashboard]
      operationId: getTransaction
