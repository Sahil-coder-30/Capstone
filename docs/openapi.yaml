        '200':
          description: The transaction.
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, const: success }
                  data: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/FaultNotFound' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  # ---------------------------------------------------------------------------
  # GET /api/payments/usage-events
  # ---------------------------------------------------------------------------
  # PURPOSE    Every recorded AI request (tokens, credits, model, project), filterable.
  # CALLED BY  payments_frontend usage page.
  # AUTH       Bearer.
  # HLD        Browser --GET /api/payments/usage-events?page&limit&company&agentType&search&startDate&endDate-->
  #              payments-service --> Postgres usage_events (newest first) --> 200 { data }
  # NOTE       "company" filters on the provider column (nvidia | unknown).
  # CODE       Payments/controllers/subscription.controller.js (getUsageEvents), Payments/services/usage.service.js
  /api/payments/usage-events:
