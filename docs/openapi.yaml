openapi: 3.1.0
info:
  title: Taksha Cloud & AI Orchestration Platform API
  version: 1.0.0
  description: |
    Exhaustive production-grade OpenAPI 3.1.0 specification for the **Taksha** microservices ecosystem:
    - **Auth Service**: Google OAuth 2.0, RS256 JWT lifecycle, JWKS public key discovery, rotating refresh token reuse detection, user profiles, and UI preferences.
    - **Payments & Credits Service**: Razorpay order management, payment signature verification, credit deduction, subscription plan queuing, transaction audit logs, and admin controls.
    - **AI Orchestration Service**: LangGraph multi-agent orchestration, SSE real-time token/node streaming, human-in-the-loop plan review, chat persistence, and soft-delete lifecycle.
    - **Sandbox Orchestration**: Kubernetes ephemeral Pod/Service lifecycle, persistent projects, S3 project synchronization, and 5-project quota enforcement.
    - **Sandbox In-Container Agent**: High-performance sandbox daemon executing bash commands, file system batch operations, unified diff patching, and ripgrep code searches.
    - **Sandbox Dynamic Router**: Subdomain-based reverse proxy routing with Redis TTL session extension.
    - **Notification Service**: Health probes and RabbitMQ AMQP event consumer specifications.

    ### Frontend Error Handling & UI/UX Integration Guide
    Every API endpoint documents complete HTTP status codes (`400`, `401`, `402`, `403`, `404`, `408`, `409`, `413`, `422`, `429`, `500`, `502`, `503`, `504`) with standardized machine-readable `code` fields:
    - `401 TOKEN_EXPIRED`: Trigger silent token refresh via `/api/auth/refresh`.
    - `401 TOKEN_REUSE_DETECTED`: Replay attack alert — flush tokens and redirect user immediately to login.
    - `402 INSUFFICIENT_CREDITS`: Prompt the Credit Top-up / Upgrade to Pro modal with provider-specific bucket info.
    - `403 FORBIDDEN`: Show permission toast or "Max Project Limit Reached" dialog.
    - `409 PATCH_CONFLICT`: Prompt Monaco Editor 3-way merge / reload workspace from disk.
    - `429 RATE_LIMIT_EXCEEDED`: Display countdown retry banner based on `retryAfter`.
    - `502/503/504 GATEWAY_TIMEOUT / SERVICE_UNAVAILABLE`: Display resilient reconnecting states for Kubernetes pod startup and upstream AI providers.
    - `SSE Error Frames`: Streaming endpoints emit `event: error` data payloads adhering to `#/components/schemas/SSEStreamErrorFrame`.
  contact:
    name: Taksha Platform Engineering
    url: https://github.com/Sahil-coder-30/Capstone
servers:
  - url: http://localhost/api
    description: Local Kubernetes Ingress Controller (via Minikube/Docker Desktop)
  - url: https://api.taksha.dev/api
    description: Production EKS Cluster Ingress Gateway
  - url: http://{sandboxId}.agent.localhost/api/agent
    description: Sandbox Container Agent Daemon (Subdomain Routing)
    variables:
      sandboxId:
        default: default-sandbox
        description: Unique UUID assigned to the active user sandbox pod

tags:
  - name: Auth
    description: User authentication, Google OAuth2, RS256 token refresh, and JWKS discovery
  - name: Profile & Preferences
    description: User developer profile and IDE/Copilot preference management
  - name: Payments - Checkout
    description: Razorpay order generation and client-side signature confirmation
  - name: Payments - Credit & Subscription
    description: Credit balance queries, deduction, plan queueing, and transaction history
  - name: Payments - Admin
    description: Administrative credit overrides, resets, and global transaction audits
  - name: AI Orchestration
    description: Autonomous LangGraph coding agents, App planning agent, and Human-in-the-loop approvals
  - name: AI Chat History
    description: Chat sessions, soft deletion, trash recovery, and message management
  - name: Sandbox Orchestration
    description: Ephemeral Kubernetes Pod & Service orchestration and project state management
  - name: Sandbox Agent
    description: In-container file management, unified diff patching, ripgrep search, and bash execution
  - name: Router & Infrastructure
    description: Subdomain reverse proxy health and routing telemetry

paths:
  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: JWKS Public Key Discovery
      description: |
        Returns the JSON Web Key Set (RFC 7517) containing the Auth service's RSA Public Key (`auth-rsa-v1`).
        Microservices (`Payments`, `AI Orchestration`, `Sandbox`) fetch and cache this key locally to verify incoming RS256 JWTs with zero DB roundtrips.
      responses:
        '200':
          description: JWKS public key payload
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=86400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'
        '500':
          description: Server configuration failure (RSA key missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/healthz:
    get:
      tags: [Auth]
      summary: Auth Service Liveness Probe
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardHealthResponse'
        '503':
          description: Service unhealthy (process or Redis unresponsive)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'

  /auth/readyz:
    get:
      tags: [Auth]
      summary: Auth Service Readiness Probe
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardHealthResponse'
        '503':
          description: Database or dependency not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableErrorResponse'

  /auth/google:
    get:
      tags: [Auth]
      summary: Initiate Google OAuth 2.0
      description: Redirects user to Google OAuth consent screen requesting `profile` and `email` scopes.
      responses:
        '302':
          description: Redirect to accounts.google.com
        '500':
          description: OAuth configuration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth Callback
      description: Handles Google OAuth redirect, provisions/syncs user in MongoDB, issues an RS256 access token, sets an HTTP-only refresh token cookie, and redirects to frontend client.
      responses:
        '302':
          description: Redirect to CLIENT_URL with authenticated cookies
        '400':
          description: Invalid authorization code or state mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Google token exchange rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Internal token generation or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/getMe:
    get:
      tags: [Auth]
      summary: Get Authenticated User Profile & Session
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Authenticated user payload resolved
          content:
            application/json:
              schema:
                type: object
                required: [status, message, user]
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: User found successfully }
                  user: { $ref: '#/components/schemas/User' }
                  accessToken: { type: string, nullable: true }
        '401':
          description: Access token missing, expired, or invalid. Frontend should initiate silent refresh.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '404':
          description: User record no longer exists in database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Server error resolving user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate Refresh Token & Issue New Access Token
      description: |
        Consumes the HTTP-only rotating refresh token cookie.
        Implements **Reuse Detection**: If an already-rotated token is presented, the entire token family is immediately revoked to thwart replay attacks.
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "refreshToken=abc...; Path=/api/auth/refresh; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema:
                type: object
                required: [status, message, accessToken]
                properties:
                  status: { type: string, example: success }
                  message: { type: string, example: Access token refreshed successfully }
                  accessToken: { type: string, example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..." }
        '400':
          description: Malformed request or missing cookie header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: |
            Refresh token expired, invalid, or **REUSE DETECTED**.
            If `code` is `TOKEN_REUSE_DETECTED`, the frontend must immediately purge all local state and force redirect to `/login`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSecurityErrorResponse'
        '404':
          description: User associated with token family was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Internal token rotation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Terminate Session & Revoke Token Family
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Blacklists the active access token in Redis and purges the refresh token family from MongoDB.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '401':
          description: Missing or unparseable authorization header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Redis cache or database revocation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/profile:
    get:
      tags: [Profile & Preferences]
      summary: Fetch Developer Profile
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                type: object
                required: [status, profile]
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  profile: { $ref: '#/components/schemas/Profile' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '404':
          description: Profile record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Database error fetching profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
    put:
      tags: [Profile & Preferences]
      summary: Update Developer Profile
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, example: "Full Stack Engineer building with AI agents." }
                github: { type: string, example: "https://github.com/octocat" }
                linkedin: { type: string, example: "https://linkedin.com/in/octocat" }
                twitter: { type: string, example: "https://twitter.com/octocat" }
                website: { type: string, example: "https://octocat.dev" }
                company: { type: string, example: "Acme Corp" }
                jobTitle: { type: string, example: "Staff Engineer" }
                skills:
                  type: array
                  items: { type: string }
                  example: ["React", "Node.js", "LangGraph", "Docker"]
                experienceYears: { type: integer, minimum: 0, example: 5 }
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, profile]
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  profile: { $ref: '#/components/schemas/Profile' }
        '400':
          description: Validation error (e.g. invalid URL format or negative experience years)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Database update failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /auth/preferences:
    get:
      tags: [Profile & Preferences]
      summary: Fetch User IDE Preferences
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Preferences retrieved
          content:
            application/json:
              schema:
                type: object
                required: [status, preferences]
                properties:
                  status: { type: string, example: success }
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '404':
          description: Preferences not initialized for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Database error fetching preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
    put:
      tags: [Profile & Preferences]
      summary: Update User IDE Preferences
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
      responses:
        '200':
          description: Preferences updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, preferences]
                properties:
                  status: { type: string, example: success }
                  preferences: { $ref: '#/components/schemas/Preferences' }
        '400':
          description: Invalid preference schema or unsupported theme/model enum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Database error updating preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  # ═══════════════════════════════════════════════════════════════════════════
  # PAYMENTS SERVICE
  # ═══════════════════════════════════════════════════════════════════════════
  /payments/credit/packages:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Get Public Subscription Packages
      description: Returns active pricing tiers and credit top-up packages for public display on the pricing page.
      responses:
        '200':
          description: Package catalog list
          content:
            application/json:
              schema:
                type: object
                required: [status, data]
                properties:
                  status: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Package' }
        '500':
          description: Failed to retrieve package catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Fetch Credit Balance & Provider Buckets
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Returns current credit balance, active subscription tier, and per-provider quotas (Mistral, Google, OpenAI, Anthropic, Groq).
      responses:
        '200':
          description: Credit balance details
          content:
            application/json:
              schema:
                type: object
                required: [status, credit]
                properties:
                  status: { type: string, example: success }
                  credit: { $ref: '#/components/schemas/Credit' }
        '401':
          description: Account ID not resolved from token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '404':
          description: Credit record not initialized for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        '500':
          description: Internal error fetching credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/check:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Verify Credit Availability (Pre-flight Gate)
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: High-throughput check called by AI Orchestration before initiating an LLM agent run.
      parameters:
        - name: company
          in: query
          required: false
          schema:
            type: string
            enum: [mistral, google, openai, anthropic, groq]
            default: mistral
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [free, pro, enterprise]
      responses:
        '200':
          description: Credit availability status
          content:
            application/json:
              schema:
                type: object
                required: [status, hasCredit, creditsRemaining]
                properties:
                  status: { type: string, example: success }
                  hasCredit: { type: boolean, example: true }
                  creditsRemaining: { type: number, example: 18.5 }
                  isMetered: { type: boolean, example: false }
        '400':
          description: Invalid provider company or tier requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '402':
          description: Insufficient AI credits. Frontend should open Credit Top-up / Upgrade Modal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsErrorResponse'
        '500':
          description: Internal error evaluating credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/update:
    post:
      tags: [Payments - Credit & Subscription]
      summary: Deduct Credits & Record Token Usage
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Called after AI execution to record prompt/completion tokens, burn credits, and update financial ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, promptTokens, completionTokens]
              properties:
                userId: { type: string, description: "Account ObjectId override (if called from internal service)" }
                company: { type: string, enum: [mistral, google, openai, anthropic, groq] }
                modelId: { type: string, example: "mistral-large-latest" }
                agentType: { type: string, enum: [codingAgent, copilot, general, unknown], default: unknown }
                projectId: { type: string, example: "67cb1a2934..." }
                requestId: { type: string, example: "req_98127391823" }
                promptTokens: { type: integer, minimum: 0, example: 450 }
                completionTokens: { type: integer, minimum: 0, example: 820 }
                totalTokens: { type: integer, minimum: 0, example: 1270 }
      responses:
        '200':
          description: Usage recorded and credits updated
          content:
            application/json:
              schema:
                type: object
                required: [status, creditsDeducted, remainingCredits]
                properties:
                  status: { type: string, example: success }
                  creditsDeducted: { type: number, example: 1.27 }
                  remainingCredits: { type: number, example: 17.23 }
        '400':
          description: Validation error (e.g. negative token count or unknown provider)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '402':
          description: Insufficient credits to burn usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsErrorResponse'
        '500':
          description: Ledger mutation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/subscription:
    patch:
      tags: [Payments - Credit & Subscription]
      summary: Direct Tier Modification
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription:
                  type: string
                  enum: [free, pro, enterprise]
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccessResponse'
        '400':
          description: Invalid subscription tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '403':
          description: Forbidden - Direct tier override requires elevated rights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenErrorResponse'
        '500':
          description: Database update error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/transactions:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Paginated Transaction Ledger
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                required: [status, transactions]
                properties:
                  status: { type: string, example: success }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '400':
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Ledger query failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/transactions/summary:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Financial & Credit Spending Summary
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Aggregated transaction statistics
          content:
            application/json:
              schema:
                type: object
                required: [status, summary]
                properties:
                  status: { type: string, example: success }
                  summary:
                    type: object
                    required: [totalPurchasedPaise, totalCreditsBurned, activeTier]
                    properties:
                      totalPurchasedPaise: { type: integer, example: 99900 }
                      totalCreditsBurned: { type: number, example: 124.5 }
                      activeTier: { type: string, example: pro }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Aggregation query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/credit/analytics:
    get:
      tags: [Payments - Credit & Subscription]
      summary: Token Consumption Analytics
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Daily token and cost breakdown
          content:
            application/json:
              schema:
                type: object
                required: [status, analytics]
                properties:
                  status: { type: string, example: success }
                  analytics:
                    type: array
                    items:
                      type: object
                      required: [date, tokens, credits]
                      properties:
                        date: { type: string, format: date }
                        tokens: { type: integer }
                        credits: { type: number }
        '400':
          description: Invalid days parameter (e.g. negative or exceeding 365)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedErrorResponse'
        '500':
          description: Analytics processing failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

  /payments/create/order:
    post:
      tags: [Payments - Checkout]
      summary: Create Razorpay Order
      security:
        - BearerAuth: []
        - CookieAuth: []
      description: Generates an official Razorpay order with currency INR and a tamper-proof receipt ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
