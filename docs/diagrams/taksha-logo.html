
<style>
  .logo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border); }
  .logo-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1.5rem; gap: 1.5rem; }
  .cell-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; text-align: center; }
  .dark-bg { background: #0A0B0F; }
  .light-bg { background: #F4F5F8; }
  .mid-bg { background: #141520; }
  .green-bg { background: #0D8A6A; }
</style>

<div style="padding: 1rem 0 0.5rem;">
  <p style="font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1.5rem;">Taksha · Logo system</p>

  <div class="logo-grid">

    <!-- PRIMARY: Dark canvas -->
    <div class="logo-cell dark-bg">
      <svg width="240" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3DC5A1"/>
            <stop offset="100%" stop-color="#0D8A6A"/>
          </linearGradient>
          <linearGradient id="g1b" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5591F7"/>
            <stop offset="100%" stop-color="#1B6EF3"/>
          </linearGradient>
        </defs>
        <!-- Mark: chisel/node glyph -->
        <!-- Outer hex-ish container as layered paths -->
        <!-- Base square rotated = diamond base -->
        <rect x="8" y="8" width="48" height="48" rx="10" fill="#141520"/>
        <!-- Three nodes: planner, builder, orchestrator -->
        <!-- Connector lines -->
        <line x1="20" y1="20" x2="44" y2="20" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="32" x2="44" y2="32" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="44" x2="44" y2="44" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="20" x2="20" y2="44" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="44" y1="20" x2="44" y2="44" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Diagonal signal: the "self-heal" path -->
        <path d="M20 44 L32 20 L44 32" fill="none" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Nodes -->
        <circle cx="20" cy="20" r="4" fill="#0D8A6A"/>
        <circle cx="44" cy="20" r="3" fill="#3D3F52"/>
        <circle cx="32" cy="20" r="2.5" fill="#3DC5A1"/>
        <circle cx="20" cy="32" r="2.5" fill="#3D3F52"/>
        <circle cx="44" cy="32" r="4" fill="url(#g1b)"/>
        <circle cx="20" cy="44" r="3" fill="#3D3F52"/>
        <circle cx="32" cy="44" r="3.5" fill="#0D8A6A"/>
        <circle cx="44" cy="44" r="2.5" fill="#3D3F52"/>
        <!-- Wordmark -->
        <text x="72" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F0F0F5" letter-spacing="-0.5">TAKSHA</text>
        <text x="72" y="50" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#6B6E82" letter-spacing="2.5">CODESPACE</text>
      </svg>
      <div class="cell-label" style="color:#3D3F52;">Primary · Dark</div>
    </div>

    <!-- LIGHT canvas -->
    <div class="logo-cell light-bg">
      <svg width="240" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3DC5A1"/>
            <stop offset="100%" stop-color="#0D8A6A"/>
          </linearGradient>
        </defs>
        <rect x="8" y="8" width="48" height="48" rx="10" fill="#E8FFF8"/>
        <line x1="20" y1="20" x2="44" y2="20" stroke="#C5E8E0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="32" x2="44" y2="32" stroke="#C5E8E0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="44" x2="44" y2="44" stroke="#C5E8E0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="20" y1="20" x2="20" y2="44" stroke="#C5E8E0" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="44" y1="20" x2="44" y2="44" stroke="#C5E8E0" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M20 44 L32 20 L44 32" fill="none" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="20" r="4" fill="#0D8A6A"/>
        <circle cx="44" cy="20" r="3" fill="#C5C7D4"/>
        <circle cx="32" cy="20" r="2.5" fill="#3DC5A1"/>
        <circle cx="20" cy="32" r="2.5" fill="#C5C7D4"/>
        <circle cx="44" cy="32" r="4" fill="#1B6EF3"/>
        <circle cx="20" cy="44" r="3" fill="#C5C7D4"/>
        <circle cx="32" cy="44" r="3.5" fill="#0D8A6A"/>
        <circle cx="44" cy="44" r="2.5" fill="#C5C7D4"/>
        <text x="72" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="600" fill="#0A0B0F" letter-spacing="-0.5">TAKSHA</text>
        <text x="72" y="50" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#7A7D96" letter-spacing="2.5">CODESPACE</text>
      </svg>
      <div class="cell-label" style="color:#C5C7D4;">Secondary · Light</div>
    </div>

    <!-- ICON ONLY variants -->
    <div class="logo-cell mid-bg" style="flex-direction:row; gap:2rem; padding:2rem;">
      <!-- Large icon -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <svg width="72" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3DC5A1"/>
              <stop offset="100%" stop-color="#0D8A6A"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="64" height="64" rx="14" fill="#0D8A6A"/>
          <line x1="16" y1="16" x2="48" y2="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="32" x2="48" y2="32" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="48" x2="48" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="16" x2="16" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="48" y1="16" x2="48" y2="48" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 48 L32 16 L48 32" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="5" fill="white"/>
          <circle cx="48" cy="16" r="3.5" fill="rgba(255,255,255,0.4)"/>
          <circle cx="32" cy="16" r="3" fill="rgba(255,255,255,0.7)"/>
          <circle cx="16" cy="32" r="3" fill="rgba(255,255,255,0.4)"/>
          <circle cx="48" cy="32" r="5" fill="white"/>
          <circle cx="16" cy="48" r="3.5" fill="rgba(255,255,255,0.4)"/>
          <circle cx="32" cy="48" r="4.5" fill="white"/>
          <circle cx="48" cy="48" r="3" fill="rgba(255,255,255,0.4)"/>
        </svg>
        <div class="cell-label" style="color:#3D3F52;">App icon</div>
      </div>
      <!-- Small 32px icon -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <svg width="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="64" height="64" rx="14" fill="#0D8A6A"/>
          <path d="M16 48 L32 16 L48 32" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="5" fill="white"/>
          <circle cx="48" cy="32" r="5" fill="rgba(255,255,255,0.85)"/>
          <circle cx="32" cy="48" r="4.5" fill="white"/>
        </svg>
        <div class="cell-label" style="color:#3D3F52;">32px</div>
      </div>
      <!-- 16px favicon -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <svg width="16" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="64" height="64" rx="14" fill="#0D8A6A"/>
          <path d="M16 48 L32 16 L48 32" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="6" fill="white"/>
          <circle cx="48" cy="32" r="6" fill="rgba(255,255,255,0.85)"/>
        </svg>
        <div class="cell-label" style="color:#3D3F52;">16px</div>
      </div>
    </div>

    <!-- GREEN bg wordmark -->
    <div class="logo-cell green-bg">
      <svg width="200" viewBox="0 0 200 52" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0.6)"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="44" height="44" rx="9" fill="rgba(0,0,0,0.2)"/>
        <line x1="15" y1="15" x2="37" y2="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="15" y1="26" x2="37" y2="26" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="15" y1="37" x2="37" y2="37" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="15" y1="15" x2="15" y2="37" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="37" y1="15" x2="37" y2="37" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M15 37 L26 15 L37 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="15" cy="15" r="4" fill="white"/>
        <circle cx="37" cy="26" r="4" fill="rgba(255,255,255,0.85)"/>
        <circle cx="26" cy="37" r="3.5" fill="white"/>
        <text x="58" y="27" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="white" letter-spacing="-0.5">TAKSHA</text>
        <text x="58" y="43" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="400" fill="rgba(255,255,255,0.65)" letter-spacing="2.5">CODESPACE</text>
      </svg>
      <div class="cell-label" style="color:rgba(255,255,255,0.4);">Brand green</div>
    </div>

  </div>

  <!-- Usage note -->
  <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top: 1.25rem;">
    <span style="font-size:10px; padding:3px 8px; border-radius:4px; background:var(--bg-accent); color:var(--text-accent);">App icon → 512×512 export</span>
    <span style="font-size:10px; padding:3px 8px; border-radius:4px; background:var(--surface-1); color:var(--text-secondary); border: 0.5px solid var(--border);">Wordmark → nav header, splash</span>
    <span style="font-size:10px; padding:3px 8px; border-radius:4px; background:var(--surface-1); color:var(--text-secondary); border: 0.5px solid var(--border);">Icon only → favicon, sidebar, badges</span>
    <span style="font-size:10px; padding:3px 8px; border-radius:4px; background:#0D8A6A22; color:#3DC5A1; border: 0.5px solid #0D8A6A44;">SVG export ready</span>
  </div>
</div>
