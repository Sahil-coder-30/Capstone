        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '500': { $ref: '#/components/responses/FaultServerError' }

  /api/ai/code-agent/invoke:
    post:
      tags: [AI Orion]
      operationId: orionInvoke
      summary: Start an Orion coding run (SSE stream)
      description: |
        Starts Orion on the caller's sandbox and streams events. Every frame is
        `id: <seq>`, `event: <name>`, `data: <json>`. Keep the last `id` to resume with
        `GET /api/ai/code-agent/stream/{projectId}` and the `Last-Event-ID` header.
        A `: ping` comment arrives every 15 seconds.

        Event names: `agent:run`, `agent:session`, `agent:msg_created`, `agent:model`,
        `agent:status`, `agent:thinking`, `agent:steps`, `agent:step`, `agent:message`,
        `agent:message_retract`, `agent:tool_start`, `agent:tool_end`, `agent:tool_log`,
        `agent:plan_review`, `agent:final`, `agent:done`, `agent:stopped`, `agent:error`,
        `agent:snapshot` (only on re-attach).

        Only one run per user and project at a time. Without `sessionId` a new chat is created
        and announced in `agent:session`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrionInvokeInput' }
      responses:
        '200':
          description: SSE stream. Problems after this point arrive as `agent:error` events.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            text/event-stream:
              schema:
                type: string
                description: Stream of `OrionEvent` frames (see the `x-sse-event` schema).
                x-sse-event: { $ref: '#/components/schemas/OrionEvent' }
              examples:
                start:
                  value: |
                    retry: 3000

                    id: 1
                    event: agent:run
                    data: {"runId":"m3x9a1b2c3","threadId":"019f...:1731600000000","projectId":"6735...","sessionId":"6736..."}

                    id: 2
                    event: agent:session
                    data: {"sessionId":"6736...","title":"Add a dark mode toggle","isNew":true}
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  /api/ai/code-agent/stream/{projectId}:
    get:
      tags: [AI Orion]
      operationId: orionStream
      summary: Re-attach to a live Orion run (SSE)
      description: |
        `204` means there is nothing to follow. Otherwise the stream replays missed events
        after `Last-Event-ID`, or sends one `agent:snapshot` with the whole run state, and then
        continues live.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: sessionId
          in: query
          description: Follow the run only if it works in this chat.
          schema: { $ref: '#/components/schemas/ObjectId' }
        - name: lastEventId
          in: query
          description: Same as the `Last-Event-ID` header, for clients that cannot set headers.
          schema: { type: integer }
        - name: Last-Event-ID
          in: header
          schema: { type: integer }
      responses:
        '200':
          description: SSE stream (replay or `agent:snapshot`, then live events).
          content:
            text/event-stream:
              schema: { type: string }
        '204':
          description: No live run for this project (or it works in another chat).
        '401': { $ref: '#/components/responses/FaultUnauthorized' }

  /api/ai/code-agent/stop:
    post:
      tags: [AI Orion]
      operationId: orionStop
      summary: Stop my Orion run on a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRef' }
      responses:
        '200':
          description: Stopping, or the run had already finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  message: { type: string, enum: [Stopping the agent run, The run already finished] }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }

  /api/ai/code-agent/plan-approve:
    post:
      tags: [AI Orion]
      operationId: orionPlanApprove
      summary: Approve the pending plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectRef' }
      responses:
        '202':
          description: Approved. Watch the SSE stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }
        '409': { $ref: '#/components/responses/AiNoPlanPending' }

  /api/ai/code-agent/plan-reject:
    post:
      tags: [AI Orion]
      operationId: orionPlanReject
      summary: Reject the pending plan with feedback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectRef'
                - type: object
                  properties:
                    feedback: { type: string, description: What to change in the plan. }
      responses:
        '202':
          description: Re-planning. Watch the SSE stream.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkMessage' }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '404': { $ref: '#/components/responses/AiNoActiveRun' }
        '409': { $ref: '#/components/responses/AiNoPlanPending' }

  /api/ai/app-agent/invoke:
    post:
      tags: [AI Clio]
      operationId: clioInvoke
      summary: Ask Clio (copilot), streamed
      description: |
        SSE with plain text frames. Order: `event: session` (JSON), many `data:` text chunks,
        `event: final` (the whole answer as text), `event: done` with `[DONE]`.
        A multi-line chunk is sent as several `data:` lines; join them with newlines.
        On failure: `event: error` with JSON `{ message, code }`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClioInvokeInput' }
      responses:
        '200':
          description: SSE stream.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                event: session
                data: {"id":"6736...","projectId":"6735...","title":"Explain useEffect","isNew":true}

                data: useEffect runs after

                data:  every render

                event: final
                data: useEffect runs after every render ...

                event: done
                data: [DONE]
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '403': { $ref: '#/components/responses/FaultForbidden' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }
        '503': { $ref: '#/components/responses/FaultServiceUnavailable' }

  /api/ai/app-agent/title:
    post:
      tags: [AI Clio]
      operationId: generateProjectTitle
      summary: Generate a project title from a prompt
      description: Returns at most 80 characters. Falls back to `Untitled Project` when the model fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, description: The project idea. }
                userPrompt: { type: string, description: Alias of message. }
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                type: object
                required: [title]
                properties:
                  title: { type: string, maxLength: 80, examples: [Weather Dashboard] }
        '400':
          description: No message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlainError' }
              example: { status: error, message: message or userPrompt is required }
        '401': { $ref: '#/components/responses/FaultUnauthorized' }
        '402': { $ref: '#/components/responses/FaultInsufficientCredits' }
        '429': { $ref: '#/components/responses/FaultRateLimited' }

  /api/ai/chats/{agentType}/sessions:
