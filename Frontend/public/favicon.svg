<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Taksha Favicon">
  <defs>
    <linearGradient id="favBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DC5A1"/>
      <stop offset="100%" stop-color="#0D8A6A"/>
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5591F7"/>
      <stop offset="100%" stop-color="#1B6EF3"/>
    </linearGradient>
  </defs>

  <!-- Onyx container -->
  <rect width="64" height="64" rx="14" fill="#141520" stroke="url(#favBox)" stroke-width="1.5"/>

  <!-- Blueprint grid lines -->
  <line x1="16" y1="16" x2="48" y2="16" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="48" y2="48" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="48" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="48" y2="48" stroke="#1C1E2E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Connection path -->
  <path d="M16 48 L32 16 L48 32" fill="none" stroke="url(#favBox)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent Nodes -->
  <circle cx="16" cy="16" r="3" fill="#3D3F52"/>
  <circle cx="48" cy="16" r="2.5" fill="#3D3F52"/>
  <circle cx="32" cy="16" r="3.5" fill="#3DC5A1"/>
  <circle cx="16" cy="32" r="2.5" fill="#3D3F52"/>
  <circle cx="48" cy="32" r="4.5" fill="url(#favBlue)"/>
  <circle cx="16" cy="48" r="3" fill="#3D3F52"/>
  <circle cx="32" cy="48" r="4" fill="#0D8A6A"/>
  <circle cx="48" cy="48" r="2.5" fill="#3D3F52"/>
</svg>