apiVersion: v1
kind: ServiceAccount
metadata:
  name:  resource-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-manager
rules:
- apiGroups: [""]
  resources: ["pods","pods/log", "services" , "deployment"]
  verbs: ["get", "list", "watch" ,"create" , "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name : resource-manager-binding
subjects:
- kind: ServiceAccount
  name: resource-manager
  namespace: default
roleRef:
  kind: Role
  name: resource-manager
  apiGroup: rbac.authorization.k8s.io

# Sandbox pods get no service account token at all
# (automountServiceAccountToken: false in Sandbox/server/src/kubernetes/pod.js).
# The old sandbox-agent-sa let user code read every pod's logs in this
# namespace. Existing clusters keep the old objects until deleted:
#   kubectl delete rolebinding sandbox-agent-role-binding
#   kubectl delete role sandbox-agent-role
#   kubectl delete serviceaccount sandbox-agent-sa
