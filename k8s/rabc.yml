apiVersion: v1
kind: ServiceAccount
metadata:
  name:  resource-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: resource-manager
rules:
- apiGroups: [""]
  resources: ["pods","pods/log", "services" , "deployment"]
  verbs: ["get", "list", "watch" ,"create" , "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name : resource-manager-binding
subjects:
- kind: ServiceAccount
  name: resource-manager
  namespace: default
roleRef:
  kind: Role
  name: resource-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-agent-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-agent-role
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-agent-role-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: sandbox-agent-sa
  namespace: default
roleRef:
  kind: Role
  name: sandbox-agent-role
  apiGroup: rbac.authorization.k8s.io

