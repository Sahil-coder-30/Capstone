apiVersion: apps/v1
kind: Deployment
metadata:
  name:  ai-deployment
  labels:
    name:  ai-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - image:  ai-orchestration
        imagePullPolicy: IfNotPresent
        name:  ai-server-container
        resources:
          requests:
            cpu: "250m"
            memory: "128M"
          limits:
            cpu: "500m"
            memory: "256M"
        env:
          - name: NVIDIA_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: NVIDIA_API_KEY
          - name: TAVILY_API_KEY
            valueFrom:
              secretKeyRef:
                name: ai-secret
                key: TAVILY_API_KEY
                optional: true
          - name: SANDBOX_SERVICE_URL
            value: "http://sandbox-service"

          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: AI
          
          
          - name: AUTH_JWKS_URI
            value: "http://auth-service/.well-known/jwks.json"

          - name: REDIS_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: REDIS_URI      
          - name: PAYMENTS_SERVICE_URL
            value: "http://payments-service"
        livenessProbe:
          httpGet:
            path: /api/ai/healthz
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/ai/readyz
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
        - containerPort:  3000
          name:  ai-server-port
