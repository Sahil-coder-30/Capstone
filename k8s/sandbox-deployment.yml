apiVersion: apps/v1
kind: Deployment
metadata:
  name:  sandbox-deployment
  labels:
    name:  sandbox-deployment
spec:
  replicas : 1
  selector : 
    matchLabels:
      app: sandbox
  template:
    metadata:
      labels:
        app : sandbox
    spec:
      serviceAccountName : resource-manager
      containers:
      - image:  sandbox:latest
        imagePullPolicy: IfNotPresent
        name:  main-sandbox-container
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "400Mi"
        env:
          - name: REDIS_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: REDIS_URI

          - name: MONGO_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: SANDBOX

          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: jwt
                key: JWT_SECRET

        livenessProbe:
          httpGet:
            path: /api/sandbox/health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/sandbox/ready
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5  
        ports:
        - containerPort:  3000
          name:  sandbox-port
        