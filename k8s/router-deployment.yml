apiVersion: apps/v1
kind: Deployment
metadata:
  name:  router-deployment
  labels:
    name:  router-deployment
spec:
  replicas : 1
  selector : 
    matchLabels:
        app: router
  template:
    metadata:
      labels:
        app: router
    spec:
      containers:
      - image:  router:latest
        imagePullPolicy: IfNotPresent
        name:  router-container
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/router/health
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/router/ready
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10     
        env:
          - name: AUTH_SERVICE_URL
            value: "http://auth-service"
          - name: SANDBOX_SERVICE_URL
            value: "http://sandbox-service"
          # Shared secret for service-to-service /internal calls (MCP gateway).
          - name: INTERNAL_SERVICE_TOKEN
            valueFrom:
              secretKeyRef:
                name: internal-service
                key: INTERNAL_SERVICE_TOKEN
                optional: true
          - name: REDIS_URI
            valueFrom:
              secretKeyRef:
                name: database
                key: REDIS_URI 
        ports:
        - containerPort:  3000
          name:  router-port