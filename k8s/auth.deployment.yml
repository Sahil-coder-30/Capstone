apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    name:  auth-deployment
spec:
  replicas : 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app:  auth
    spec: 
      containers:
      - image:  auth
        imagePullPolicy: IfNotPresent
        name:  auth-container
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  MONGO_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: AUTH

        - name:  MQ_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: MQ_URL
        
        - name:  RSA_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: jwt
              key: RSA_PRIVATE_KEY

        - name:  JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt
              key: JWT_REFRESH_SECRET

        - name:  GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_ID

        - name:  GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_SECRET

        - name: REDIS_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: REDIS_URI
        ports:
        - containerPort:  3000
          name:  auth-http
        