apiVersion: apps/v1
kind: Deployment
metadata:
  name:  notification-deployment
  labels:
    name: notifiction-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - image:  notification
        imagePullPolicy: IfNotPresent
        name:  notification-container
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  MQ_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: MQ_URL 
              
        - name:  GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_ID

        - name:  GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_CLIENT_SECRET

        - name:  GOOGLE_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: google
              key: GOOGLE_REFRESH_TOKEN

        - name:  EMAIL_USER
          valueFrom:
            secretKeyRef:
              name: google
              key: EMAIL_USER

        - name: REDIS_URI
          valueFrom:
            secretKeyRef:
              name: database
              key: REDIS_URI
          

        - name: AUTH_JWKS_URI
          value: "http://auth-service/.well-known/jwks.json"
           
        ports:
        - containerPort:  4000
          name:  ntfy-port