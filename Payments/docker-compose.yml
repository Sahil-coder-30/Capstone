# Local Postgres for the Payments test suite only.
# Start:  docker compose up -d      (from Payments/)
# Stop:   docker compose down       (add -v to also delete the data)
#
# The app itself uses Supabase (DATABASE_URL in .env). Tests use
# TEST_DATABASE_URL=postgres://payments:payments_test@localhost:5433/payments_test
services:
  postgres-test:
    image: postgres:16
    container_name: payments-postgres-test
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_test
      POSTGRES_DB: payments_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments_test"]
      interval: 2s
      timeout: 3s
      retries: 20
