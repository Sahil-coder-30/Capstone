<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Plans, AI credits, usage and invoices for your Taksha CodeSpace account." />
    <title>Billing · Taksha CodeSpace</title>
    <script>
      // Apply the saved theme before first paint so light users never see a dark flash.
      try {
        if ((localStorage.getItem('theme') || 'light') === 'light') document.documentElement.classList.add('light-theme');
      } catch (e) {
        document.documentElement.classList.add('light-theme');
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Razorpay's checkout script is loaded on demand at payment time. -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
